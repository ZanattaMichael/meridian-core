[workspace]
resolver = "2"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The oldest Rust that builds the workspace. CI builds with it once (the
# `minimum rust` job), so a newer feature is a deliberate bump here, not a
# surprise for whoever builds from source.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ZanattaMichael/meridian-core"

# Every third-party crate is named here once, with its version and features,
# and a crate says `serde_json = { workspace = true }`. One place to bump, and
# the workspace cannot drift onto two lines of the same crate (cargo-deny's
# `bans` check in deny.toml fails the build if it does).
[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
ed25519-dalek = "3"
flate2 = "1"
getrandom = "0.4.3"
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema = { version = "0.61", default-features = false }
libc = "0.2"
lsp-server = "0.10"
lsp-types = "0.97"
proptest = { version = "1", default-features = false, features = ["std"] }
prost = "0.14"
protox = "0.10"
regex = "1"
saphyr-parser = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tokio = "1"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
ureq = "3"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# What a release is built with: `cargo build --profile dist`. Symbols are
# stripped and the binaries are optimised across crates, since a release
# ships some twenty of them.
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
