[workspace]
resolver = "2"
members = ["crates/*", "plugins/ansible", "plugins/openvox", "plugins/puppet", "plugins/terraform", "plugins/cloudformation", "plugins/bicep", "plugins/kubernetes", "plugins/docker", "plugins/chef", "plugins/dsc", "plugins/podman", "plugins/cloud-init", "plugins/helm", "plugins/packer", "plugins/salt", "plugins/opentofu", "plugins/pulumi", "plugins/arm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZanattaMichael/meridian-core"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# What a release is built with: `cargo build --profile dist`. Symbols are
# stripped and the binaries are optimised across crates, since a release
# ships some twenty of them.
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
