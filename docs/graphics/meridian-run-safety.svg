<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Running safely: the lock, the analyzers and the policy check, the record of every event, the run-state, the tool logs kept on the machine, and what happens when a stage fails">
<title>Running safely: the lock, the analyzers and the policy check, the record of every event, the run-state, the tool logs kept on the machine, and what happens when a stage fails</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
<defs>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA3E8"/></marker>
</defs>
<rect width="1200" height="640" rx="24" fill="url(#g-bg)"/>
<rect x="40" y="40" width="260" height="70" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><rect x="40" y="40" width="260" height="5" rx="2.5" fill="#FFFFFF"/><text x="170" y="70" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">meridian plan / apply</text><text x="170" y="92" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">validate and compile take no lock</text><path d="M170 110L170 150" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M170 110L170 150" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:0s"/><path d="M170 110L170 150" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:0s"/><rect x="40" y="150" width="260" height="70" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="40" y="150" width="260" height="5" rx="2.5" fill="#8FA3E8"/><text x="170" y="180" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">take the state lock</text><text x="170" y="202" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">one run at a time per state</text><path d="M300 185L400 185" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M300 185L400 185" fill="none" stroke="#FF7A90" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.2s;animation-delay:-0.5s"/><path d="M300 185L400 185" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.2s;animation-delay:-0.5s"/><rect x="400" y="150" width="300" height="70" rx="14" fill="#16224F" stroke="#FF7A90" stroke-width="1.5"/><rect x="400" y="150" width="300" height="5" rx="2.5" fill="#FF7A90"/><text x="550" y="180" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">refused, told who holds it</text><text x="550" y="202" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">nothing is run</text><path d="M170 220L170 260" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M170 220L170 260" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:-0.4s"/><path d="M170 220L170 260" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:-0.4s"/><rect x="40" y="260" width="260" height="70" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="40" y="260" width="260" height="5" rx="2.5" fill="#8FA3E8"/><text x="170" y="290" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">--analyze, --policy</text><text x="170" y="312" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the compiled files are scanned,</text><text x="170" y="328.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">every change is asked about first</text><path d="M300 295L400 295" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M300 295L400 295" fill="none" stroke="#FF7A90" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.2s;animation-delay:-0.9s"/><path d="M300 295L400 295" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.2s;animation-delay:-0.9s"/><rect x="400" y="260" width="300" height="70" rx="14" fill="#16224F" stroke="#FF7A90" stroke-width="1.5"/><rect x="400" y="260" width="300" height="5" rx="2.5" fill="#FF7A90"/><text x="550" y="290" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">the run fails</text><text x="550" y="312" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">nothing was applied</text><path d="M170 330L170 370" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M170 330L170 370" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:-0.8s"/><path d="M170 330L170 370" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:-0.8s"/><rect x="40" y="370" width="260" height="70" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><rect x="40" y="370" width="260" height="5" rx="2.5" fill="#FFFFFF"/><text x="170" y="400" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">run the stages in order</text><text x="170" y="422" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">Infrastructure, then ResourceSets</text><path d="M300 405L740 405" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M300 405L740 405" fill="none" stroke="#35D0C2" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-0.2s"/><path d="M300 405L740 405" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-0.2s"/><text x="520" y="396" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">every change of state is an event</text><rect x="740" y="340" width="200" height="128" rx="14" fill="#16224F" stroke="#35D0C2" stroke-width="1.5"/><rect x="740" y="340" width="200" height="5" rx="2.5" fill="#35D0C2"/><text x="840" y="370" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">the record</text><text x="840" y="392" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">runs/&lt;id&gt;/run.json</text><text x="840" y="408.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">runs/&lt;id&gt;/events.jsonl</text><text x="840" y="425.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">names things, holds</text><text x="840" y="442.625" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">no value and no secret</text><path d="M720 405L720 250L740 250" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M720 405L720 250L740 250" fill="none" stroke="#FF8A4C" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.6s"/><path d="M720 405L720 250L740 250" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.6s"/><rect x="740" y="190" width="420" height="120" rx="14" fill="#16224F" stroke="#FF8A4C" stroke-width="1.5"/><rect x="740" y="190" width="420" height="5" rx="2.5" fill="#FF8A4C"/><text x="950" y="220" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">on this machine only, never sent</text><text x="950" y="242" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">runs/&lt;id&gt;/logs/: each step&#x27;s tool output, masked;</text><text x="950" y="258.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">meridian logs reads it, meridian bug-report packs it</text><text x="950" y="275.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">history/: what a rollback applies again</text><rect x="960" y="340" width="200" height="128" rx="14" fill="#16224F" stroke="#35D0C2" stroke-width="1.5"/><rect x="960" y="340" width="200" height="5" rx="2.5" fill="#35D0C2"/><text x="1060" y="370" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">the run-state</text><text x="1060" y="392" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">state.json</text><text x="1060" y="408.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">which stage applied</text><text x="1060" y="425.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">which artifact, by hash;</text><text x="1060" y="442.625" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">outputs are read back</text><path d="M840 468L840 520" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M840 468L840 520" fill="none" stroke="#35D0C2" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1s"/><path d="M840 468L840 520" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1s"/><path d="M1060 468L1060 520" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M1060 468L1060 520" fill="none" stroke="#35D0C2" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1.4s"/><path d="M1060 468L1060 520" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1.4s"/><rect x="740" y="520" width="420" height="56" rx="28" fill="#101A3F" stroke="#35D0C2" stroke-width="1.2"/><text x="950" y="543" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">backend</text><text x="950" y="562" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the state directory, or a store a team shares</text><path d="M170 440L170 480" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M170 440L170 480" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:-1.2s"/><path d="M170 440L170 480" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:-1.2s"/><rect x="40" y="480" width="260" height="70" rx="14" fill="#16224F" stroke="#7EE2A8" stroke-width="1.5"/><rect x="40" y="480" width="260" height="5" rx="2.5" fill="#7EE2A8"/><text x="170" y="510" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">all stages done?</text><text x="170" y="532" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">yes: release the lock</text><path d="M300 515L400 515" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M300 515L400 515" fill="none" stroke="#FF8A4C" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.2s;animation-delay:-1.6s"/><path d="M300 515L400 515" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.2s;animation-delay:-1.6s"/><rect x="400" y="480" width="300" height="112" rx="14" fill="#16224F" stroke="#FF8A4C" stroke-width="1.5"/><rect x="400" y="480" width="300" height="5" rx="2.5" fill="#FF8A4C"/><text x="550" y="510" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">a stage failed: --on-failure</text><text x="550" y="532" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">stop (default): release the lock;</text><text x="550" y="548.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">apply --resume continues there</text><text x="550" y="565.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">rollback: put back every stage</text><text x="550" y="582.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">this run changed, last first</text><rect x="400" y="40" width="760" height="90" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.2" stroke-dasharray="5 5"/><text x="430" y="68" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Afterwards</text><text x="430" y="92" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">meridian drift asks each tool whether what was applied is still what is there. meridian rollback puts a finished run back.</text><text x="430" y="108.875" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">Each tool owns its own state: Meridian&#x27;s record says what Meridian did, never the truth about your infrastructure.</text><text x="600" y="616" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">A run can be repeated, shared, picked up where it stopped, or put back, because every step of it was recorded before the next began.</text>
</svg>
