<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="How a secret moves: from a provider into locked memory, as a reference everywhere else, and to the tool by a private file at run time">
<title>How a secret moves: from a provider into locked memory, as a reference everywhere else, and to the tool by a private file at run time</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
<defs>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA3E8"/></marker>
</defs>
<rect width="1200" height="600" rx="24" fill="url(#g-bg)"/>
<text x="40" y="40" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">WHERE A SECRET IS READ FROM</text><rect x="40" y="52" width="200" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="140" y="70.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">env</text><path d="M240 66L330 66" fill="none" stroke="#8FA3E8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M240 66L330 66" fill="none" stroke="#FF8A4C" stroke-width="5.6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-0s"/><path d="M240 66L330 66" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-0s"/><rect x="40" y="86" width="200" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="140" y="104.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">file</text><path d="M240 100L330 100" fill="none" stroke="#8FA3E8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M240 100L330 100" fill="none" stroke="#FF8A4C" stroke-width="5.6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-0.45s"/><path d="M240 100L330 100" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-0.45s"/><rect x="40" y="120" width="200" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="140" y="138.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">exec</text><path d="M240 134L330 134" fill="none" stroke="#8FA3E8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M240 134L330 134" fill="none" stroke="#FF8A4C" stroke-width="5.6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-0.9s"/><path d="M240 134L330 134" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-0.9s"/><rect x="40" y="154" width="200" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="140" y="172.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">keyring</text><path d="M240 168L330 168" fill="none" stroke="#8FA3E8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M240 168L330 168" fill="none" stroke="#FF8A4C" stroke-width="5.6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-1.35s"/><path d="M240 168L330 168" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-1.35s"/><rect x="40" y="188" width="200" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="140" y="206.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">systemd credential</text><path d="M240 202L330 202" fill="none" stroke="#8FA3E8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M240 202L330 202" fill="none" stroke="#FF8A4C" stroke-width="5.6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-1.8s"/><path d="M240 202L330 202" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-1.8s"/><rect x="40" y="222" width="200" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="140" y="240.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">Secret Service</text><path d="M240 236L330 236" fill="none" stroke="#8FA3E8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M240 236L330 236" fill="none" stroke="#FF8A4C" stroke-width="5.6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-2.25s"/><path d="M240 236L330 236" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-2.25s"/><rect x="40" y="256" width="200" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="140" y="274.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">macOS Keychain</text><path d="M240 270L330 270" fill="none" stroke="#8FA3E8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M240 270L330 270" fill="none" stroke="#FF8A4C" stroke-width="5.6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-2.7s"/><path d="M240 270L330 270" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.6s;animation-delay:-2.7s"/><rect x="330" y="52" width="290" height="238" rx="18" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.5"/><rect x="330" y="52" width="290" height="5" rx="2.5" fill="#FF8A4C"/><text x="475" y="84" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#FFFFFF">SecretValue</text><text x="475" y="110" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">its own block of locked memory</text><text x="475" y="127.55" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">mlock: never swapped out</text><text x="475" y="145.1" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">a guard page on each side</text><text x="475" y="162.65" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">left out of core dumps</text><text x="475" y="180.2" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">wiped the moment it is dropped</text><text x="475" y="197.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">no Debug, Clone, Eq or Serialize</text><text x="475" y="215.3" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">read only by expose(|bytes| …)</text><text x="475" y="276" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#C9D4FF">only crate meridian-secret holds the bytes</text><text x="680" y="40" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">EVERYWHERE ELSE: A NUMBER, NEVER THE BYTES</text><rect x="680" y="52" width="480" height="110" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><text x="920" y="84" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#FFFFFF">Value::Secret(3)</text><text x="920" y="108" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a plan, a log line, an event, the run record, an error, a panic:</text><text x="920" y="124.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">all made from values, so each shows (sensitive) and can show nothing else</text><text x="920" y="141.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">validate and compile fetch nothing: the table holds the name only</text><path d="M620 110L680 110" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M620 110L680 110" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-0.3s"/><path d="M620 110L680 110" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-0.3s"/><rect x="680" y="180" width="480" height="110" rx="14" fill="#16224F" stroke="#6F9BFF" stroke-width="1.5"/><rect x="680" y="180" width="480" height="5" rx="2.5" fill="#6F9BFF"/><text x="920" y="212" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">compile writes a reference, by name</text><text x="920" y="238" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">ansible:    {{ meridian_secret_db_password }}   with no_log</text><text x="920" y="254.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">terraform:  ${var.meridian_secret_db_password}   sensitive = true</text><text x="920" y="271.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">a target with no private channel stops the stage and says so</text><path d="M620 236L680 236" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M620 236L680 236" fill="none" stroke="#6F9BFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1.1s"/><path d="M620 236L680 236" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1.1s"/><text x="40" y="318" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">AT PLAN AND APPLY: THE VALUE, BY A PRIVATE CHANNEL AND NO OTHER</text><rect x="40" y="330" width="250" height="108" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><rect x="40" y="330" width="250" height="5" rx="2.5" fill="#FFFFFF"/><text x="165" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">the core</text><text x="165" y="382" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the run context carries</text><text x="165" y="398.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the value over the</text><text x="165" y="415.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">plugin&#x27;s private socket</text><rect x="330" y="330" width="250" height="108" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="330" y="330" width="250" height="5" rx="2.5" fill="#8FA3E8"/><text x="455" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">the plugin SDK</text><text x="455" y="382" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">takes it straight into</text><text x="455" y="398.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">protected memory and</text><text x="455" y="415.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">wipes the message</text><path d="M290 384L330 384" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M290 384L330 384" fill="none" stroke="#8FA3E8" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-0.5s"/><path d="M290 384L330 384" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-0.5s"/><rect x="620" y="330" width="250" height="108" rx="14" fill="#16224F" stroke="#6F9BFF" stroke-width="1.5"/><rect x="620" y="330" width="250" height="5" rx="2.5" fill="#6F9BFF"/><text x="745" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">a private file</text><text x="745" y="382" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">mode 0600, in a 0700 directory,</text><text x="745" y="398.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">on a memory filesystem,</text><text x="745" y="415.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">overwritten and removed after</text><path d="M580 384L620 384" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M580 384L620 384" fill="none" stroke="#6F9BFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1s"/><path d="M580 384L620 384" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1s"/><rect x="910" y="330" width="250" height="108" rx="14" fill="#16224F" stroke="#FF8A4C" stroke-width="1.5"/><rect x="910" y="330" width="250" height="5" rx="2.5" fill="#FF8A4C"/><text x="1035" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">the tool</text><text x="1035" y="382" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">reads it as its own</text><text x="1035" y="398.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">variables file; what it</text><text x="1035" y="415.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">prints is masked</text><path d="M870 384L910 384" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M870 384L910 384" fill="none" stroke="#FF8A4C" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1.5s"/><path d="M870 384L910 384" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2s;animation-delay:-1.5s"/><rect x="40" y="470" width="1120" height="70" rx="14" fill="#101A3F" stroke="#FF7A90" stroke-width="1.2"/><text x="70" y="498" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FF7A90">Never</text><text x="70" y="522" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">on a command line · in a tool&#x27;s environment · in a compiled file · in the state directory · in a plan file Meridian keeps · in an event</text><text x="600" y="576" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">The protection is structural: the bytes were never in what a log or a plan is made from, so there is nothing to forget to mask.</text>
</svg>
