FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M910 98L940 98" fill="none" stroke="#B48CFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.8s"/><path d="M910 98L940 98" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.8s"/><path d="M340 135C370 135 370 98 400 98" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M340 135C370 135 370 98 400 98" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0s"/><path d="M340 135C370 135 370 98 400 98" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0s"/><rect x="400" y="200" width="780" height="70" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="400" y="200" width="780" height="5" rx="2.5" fill="#8FA3E8"/><text x="790" y="230" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">stages.&lt;document&gt;</text><text x="790" y="252" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">outcome · files · warnings · refusal {rule, resource, message} · changes · condition</text><path d="M1060 136L1060 200" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M1060 136L1060 200" fill="none" stroke="#B48CFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.2s"/><path d="M1060 136L1060 200" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.2s"/><path d="M790 136L790 200" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M790 136L790 200" fill="none" stroke="#FF8A4C" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.8s"/><path d="M790 136L790 200" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.8s"/><text x="40" y="308" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">CHECKS, ALL OF THEM REPORTED</text><rect x="40" y="320" width="360" height="96" rx="14" fill="#16224F" stroke="#7EE2A8" stroke-width="1.5"/><rect x="40" y="320" width="360" height="5" rx="2.5" fill="#7EE2A8"/><text x="220" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">expect</text><text x="220" y="372" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">outcome: refused   rule: unsupported-action</text><text x="220" y="388.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">files: {playbook.yml: {contains: …}}</text><text x="220" y="405.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">changes: [{action: create}]  changeCount: 2</text><rect x="440" y="320" width="360" height="96" rx="14" fill="#16224F" stroke="#7EE2A8" stroke-width="1.5"/><rect x="440" y="320" width="360" height="5" rx="2.5" fill="#7EE2A8"/><text x="620" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">assert</text><text x="620" y="372" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">stages.web.outcome == &#x27;compiled&#x27;</text><text x="620" y="388.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">contains(stages.web.files[&#x27;playbook.yml&#x27;], &#x27;x&#x27;)</text><text x="620" y="405.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">the one expression language, no script</text><rect x="840" y="320" width="320" height="96" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><rect x="840" y="320" width="320" height="5" rx="2.5" fill="#FFFFFF"/><text x="1000" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">report</text><text x="1000" y="372" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">ok / FAIL per case, with each failure;</text><text x="1000" y="388.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">--output json: one object;</text><text x="1000" y="405.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">--junit FILE: for the pipeline engine</text><path d="M790 270L790 320" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M790 270L790 320" fill="none" stroke="#7EE2A8" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.6s"/><path d="M790 270L790 320" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.6s"/><path d="M400 368L440 368" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M400 368L440 368" fill="none" stroke="#7EE2A8" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-2s"/><path d="M400 368L440 368" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-2s"/><path d="M800 368L840 368" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M800 368L840 368" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-2.4s"/><path d="M800 368L840 368" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-2.4s"/><text x="600" y="446" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">Nothing is applied and no record is kept: a test compiles and plans, then checks. A module carries its tests under tests/.</text>
