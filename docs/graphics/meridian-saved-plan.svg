<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="A saved plan: meridian plan --out writes a file of artifact hashes, changes and each tool&#x27;s own saved plan; the pull request shows it as one comment; meridian apply --plan refuses a stale plan, hands each tool the plan it saved, and plans the others again, refusing other changes">
<title>A saved plan: meridian plan --out writes a file of artifact hashes, changes and each tool&#x27;s own saved plan; the pull request shows it as one comment; meridian apply --plan refuses a stale plan, hands each tool the plan it saved, and plans the others again, refusing other changes</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
<defs>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA3E8"/></marker>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#g-bg)"/>
<text x="40" y="40" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">MERIDIAN PLAN --OUT PLAN.MPLAN</text><rect x="40" y="56" width="300" height="150" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="40" y="56" width="300" height="5" rx="2.5" fill="#8FA3E8"/><text x="190" y="86" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">plan</text><text x="190" y="108" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">compiles every document,</text><text x="190" y="124.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">asks each tool what would change,</text><text x="190" y="141.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">asks the policy, and writes the file</text><path d="M340 131L400 131" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M340 131L400 131" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.2s"/><path d="M340 131L400 131" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.2s"/><rect x="400" y="56" width="380" height="290" rx="18" fill="#101A3F" stroke="#FFC857" stroke-width="1.4"/><rect x="400" y="56" width="380" height="5" rx="2.5" fill="#FFC857"/><text x="590" y="88" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#FFFFFF">plan.mplan</text><text x="422" y="118" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">files, data, set, selector, run</text><text x="422" y="134.875" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">stages:</text><text x="422" y="151.75" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  network  (terraform)</text><text x="422" y="168.625" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    artifactHash: sha256:9f2c…</text><text x="422" y="185.5" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    changes: create web_vm, …</text><text x="422" y="202.375" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    appliedBefore: sha256:40b1…</text><text x="422" y="219.25" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    saved: &lt;the tool&#x27;s own plan&gt;</text><text x="422" y="236.125" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    policy: allowed</text><text x="422" y="253" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  web  (ansible)   status: deferred</text><rect x="422" y="300" width="336" height="28" rx="14" fill="#101A3F" stroke="#7EE2A8" stroke-width="1.2"/><text x="590" y="318.32" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">names, hashes and summaries: never a value</text><rect x="840" y="56" width="320" height="110" rx="14" fill="#16224F" stroke="#FFC857" stroke-width="1.5"/><rect x="840" y="56" width="320" height="5" rx="2.5" fill="#FFC857"/><text x="1000" y="86" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">the pull request</text><text x="1000" y="108" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">one comment, updated in place:</text><text x="1000" y="124.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the report of the plan</text><text x="1000" y="141.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">and the policy&#x27;s decision</text><path d="M780 111L840 111" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M780 111L840 111" fill="none" stroke="#FFC857" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.8s"/><path d="M780 111L840 111" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.8s"/><text x="840" y="212" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">MERIDIAN APPLY --PLAN PLAN.MPLAN</text><rect x="840" y="228" width="320" height="118" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="840" y="228" width="320" height="5" rx="2.5" fill="#8FA3E8"/><text x="1000" y="258" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">apply</text><text x="1000" y="280" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the same stages, none applied since;</text><text x="1000" y="296.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">each document compiles to the</text><text x="1000" y="313.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">planned hash, or plan-differs;</text><text x="1000" y="330.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">its saved plan, or a re-plan that matches</text><path d="M780 287L840 287" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M780 287L840 287" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.4s"/><path d="M780 287L840 287" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.4s"/><text x="40" y="398" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">WHAT IS REFUSED, AND WHEN</text><rect x="40" y="410" width="265" height="118" rx="14" fill="#16224F" stroke="#FF7A90" stroke-width="1.5"/><rect x="40" y="410" width="265" height="5" rx="2.5" fill="#FF7A90"/><text x="172.5" y="440" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">before anything runs</text><text x="172.5" y="462" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a stage the plan does not have,</text><text x="172.5" y="478.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">or one the run does not;</text><text x="172.5" y="495.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a stage applied since the plan</text><rect x="325" y="410" width="265" height="118" rx="14" fill="#16224F" stroke="#FF7A90" stroke-width="1.5"/><rect x="325" y="410" width="265" height="5" rx="2.5" fill="#FF7A90"/><text x="457.5" y="440" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">at each stage&#x27;s turn</text><text x="457.5" y="462" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the document no longer compiles to</text><text x="457.5" y="478.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the planned artifact, or a re-plan</text><text x="457.5" y="495.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">shows other changes: plan-differs,</text><text x="457.5" y="512.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">and the run stops</text><rect x="610" y="410" width="265" height="118" rx="14" fill="#16224F" stroke="#6F9BFF" stroke-width="1.5"/><rect x="610" y="410" width="265" height="5" rx="2.5" fill="#6F9BFF"/><text x="742.5" y="440" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">by the tool itself</text><text x="742.5" y="462" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">Terraform and OpenTofu refuse a</text><text x="742.5" y="478.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">stale plan file; Pulumi a changed</text><text x="742.5" y="495.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">plan; CloudFormation an obsolete</text><text x="742.5" y="512.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">change set</text><rect x="895" y="410" width="265" height="118" rx="14" fill="#16224F" stroke="#C9D4FF" stroke-width="1.5"/><rect x="895" y="410" width="265" height="5" rx="2.5" fill="#C9D4FF"/><text x="1027.5" y="440" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">never checked</text><text x="1027.5" y="462" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a deferred stage (it waited on an</text><text x="1027.5" y="478.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">output), or a tool that cannot say</text><text x="1027.5" y="495.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">under --accept-unknown: applied</text><text x="1027.5" y="512.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">with a warning</text><text x="600" y="536" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">What a reviewer approved is what is applied: a plan file ties the two, and anything that moved in between is a refusal, not a surprise.</text>
</svg>
