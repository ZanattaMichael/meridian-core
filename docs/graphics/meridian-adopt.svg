<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="adopt: a resource names the tool&#x27;s identifier of a thing that exists; a stateful target compiles it into the tool&#x27;s import and the plan reports adopt, a converging target accepts it and changes nothing, and any other target is refused before its plugin is asked">
<title>adopt: a resource names the tool&#x27;s identifier of a thing that exists; a stateful target compiles it into the tool&#x27;s import and the plan reports adopt, a converging target accepts it and changes nothing, and any other target is refused before its plugin is asked</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
<defs>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA3E8"/></marker>
</defs>
<rect width="1200" height="470" rx="24" fill="url(#g-bg)"/>
<rect x="40" y="60" width="300" height="150" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><rect x="40" y="60" width="300" height="5" rx="2.5" fill="#FFFFFF"/><text x="190" y="90" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">a resource</text><text x="80" y="112" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">- id: logs</text><text x="80" y="128.875" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  type: aws_s3_bucket</text><text x="80" y="145.75" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  adopt: example-logs</text><text x="80" y="162.625" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  params:</text><text x="80" y="179.5" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    bucket: example-logs</text><text x="400" y="48" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">WHAT THE TARGET SAYS IT DOES WITH ADOPT</text><rect x="400" y="60" width="245" height="150" rx="14" fill="#16224F" stroke="#6F9BFF" stroke-width="1.5"/><rect x="400" y="60" width="245" height="5" rx="2.5" fill="#6F9BFF"/><text x="522.5" y="90" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">import</text><text x="522.5" y="112" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">compiled into the tool&#x27;s own import:</text><text x="522.5" y="128.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">an import block, Pulumi&#x27;s import</text><text x="522.5" y="145.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">option. The first plan says adopt,</text><text x="522.5" y="162.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the apply puts it in the state</text><rect x="665" y="60" width="245" height="150" rx="14" fill="#16224F" stroke="#FF8A4C" stroke-width="1.5"/><rect x="665" y="60" width="245" height="5" rx="2.5" fill="#FF8A4C"/><text x="787.5" y="90" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">converge</text><text x="787.5" y="112" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">accepted with a warning, and</text><text x="787.5" y="128.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">changes nothing: the tool keeps</text><text x="787.5" y="145.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">no state and makes the thing what</text><text x="787.5" y="162.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the document says either way</text><rect x="930" y="60" width="245" height="150" rx="14" fill="#16224F" stroke="#FF7A90" stroke-width="1.5"/><rect x="930" y="60" width="245" height="5" rx="2.5" fill="#FF7A90"/><text x="1052.5" y="90" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">none</text><text x="1052.5" y="112" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">refused by the core before the</text><text x="1052.5" y="128.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">plugin is asked, so no tool</text><text x="1052.5" y="145.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">creates a second thing beside</text><text x="1052.5" y="162.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the one that exists</text><path d="M340 135L400 135" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M340 135L400 135" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.2s"/><path d="M340 135L400 135" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.2s"/><text x="40" y="238" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">WHICH TARGETS</text><rect x="40" y="250" width="110" height="28" rx="14" fill="#101A3F" stroke="#6F9BFF" stroke-width="1.2"/><text x="95" y="268.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">import</text><text x="165" y="269" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">Terraform · OpenTofu · Pulumi</text><rect x="40" y="290" width="110" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="95" y="308.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">converge</text><text x="165" y="309" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">Ansible · Puppet · Chef · Salt · DSC · Kubernetes · Bicep · ARM</text><rect x="40" y="330" width="110" height="28" rx="14" fill="#101A3F" stroke="#FF7A90" stroke-width="1.2"/><text x="95" y="348.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">none</text><text x="165" y="349" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">every other target, and any plugin built before adopt</text><rect x="760" y="250" width="400" height="108" rx="14" fill="#16224F" stroke="#7EE2A8" stroke-width="1.5"/><rect x="760" y="250" width="400" height="5" rx="2.5" fill="#7EE2A8"/><text x="960" y="280" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">meridian plan</text><text x="790" y="302" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">= adopt logs: aws_s3_bucket</text><text x="790" y="318.875" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">~ update app: aws_subnet, adopted</text><text x="960" y="346" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#C9D4FF">an import that also changes the thing is reported as the change</text><text x="600" y="446" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">One field moves between tools: a stateful tool imports the thing, a converging tool already takes it as it finds it.</text>
</svg>
