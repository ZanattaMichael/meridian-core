<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Meridian inside a pipeline engine: the engine keeps the trigger, the runner and its identity, the secret release, the approval and the logs; Meridian owns the workflow, the orchestrator, the target plugins and secret delivery">
<title>Meridian inside a pipeline engine: the engine keeps the trigger, the runner and its identity, the secret release, the approval and the logs; Meridian owns the workflow, the orchestrator, the target plugins and secret delivery</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
<defs>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA3E8"/></marker>
</defs>
<rect width="1200" height="640" rx="24" fill="url(#g-bg)"/>
<text x="34" y="107" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FFC857" transform="rotate(-90 34 107)">THE ENGINE KEEPS</text><rect x="90" y="36" width="1070" height="142" rx="18" fill="#101A3F" stroke="#FFC857" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="110" y="48" width="198" height="108" rx="14" fill="#16224F" stroke="#FFC857" stroke-width="1.5"/><rect x="110" y="48" width="198" height="5" rx="2.5" fill="#FFC857"/><text x="209" y="78" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">trigger</text><text x="209" y="100" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">push, tag, schedule,</text><text x="209" y="116.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">pull request</text><rect x="323" y="48" width="198" height="108" rx="14" fill="#16224F" stroke="#FFC857" stroke-width="1.5"/><rect x="323" y="48" width="198" height="5" rx="2.5" fill="#FFC857"/><text x="422" y="78" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">runner + identity</text><text x="422" y="100" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a machine, and the OIDC</text><text x="422" y="116.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">token only it can mint</text><path d="M308 102L323 102" fill="none" stroke="#8FA3E8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M308 102L323 102" fill="none" stroke="#FFC857" stroke-width="5.5" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-0.4s"/><path d="M308 102L323 102" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-0.4s"/><rect x="536" y="48" width="198" height="108" rx="14" fill="#16224F" stroke="#FFC857" stroke-width="1.5"/><rect x="536" y="48" width="198" height="5" rx="2.5" fill="#FFC857"/><text x="635" y="78" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">secret release</text><text x="635" y="100" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the store, released to</text><text x="635" y="116.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a job after its rules pass</text><path d="M521 102L536 102" fill="none" stroke="#8FA3E8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M521 102L536 102" fill="none" stroke="#FFC857" stroke-width="5.5" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-0.8s"/><path d="M521 102L536 102" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-0.8s"/><rect x="749" y="48" width="198" height="108" rx="14" fill="#16224F" stroke="#FFC857" stroke-width="1.5"/><rect x="749" y="48" width="198" height="5" rx="2.5" fill="#FFC857"/><text x="848" y="78" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">approval</text><text x="848" y="100" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">reviewers, wait timers,</text><text x="848" y="116.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the audit trail</text><path d="M734 102L749 102" fill="none" stroke="#8FA3E8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M734 102L749 102" fill="none" stroke="#FFC857" stroke-width="5.5" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.2s"/><path d="M734 102L749 102" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.2s"/><rect x="962" y="48" width="198" height="108" rx="14" fill="#16224F" stroke="#FFC857" stroke-width="1.5"/><rect x="962" y="48" width="198" height="5" rx="2.5" fill="#FFC857"/><text x="1061" y="78" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">logs + artifacts</text><text x="1061" y="100" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">every job&#x27;s output,</text><text x="1061" y="116.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">kept and linked</text><path d="M947 102L962 102" fill="none" stroke="#8FA3E8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M947 102L962 102" fill="none" stroke="#FFC857" stroke-width="5.5" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.6s"/><path d="M947 102L962 102" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.6s"/><text x="34" y="405" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FFFFFF" transform="rotate(-90 34 405)">MERIDIAN OWNS</text><rect x="90" y="318" width="1070" height="174" rx="18" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="110" y="330" width="220" height="140" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><rect x="110" y="330" width="220" height="5" rx="2.5" fill="#FFFFFF"/><text x="220" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Workflow</text><text x="220" y="382" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">steps, order from needs,</text><text x="220" y="398.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">fan-out, gates, retry,</text><text x="220" y="415.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">finally, with: values</text><rect x="350" y="330" width="290" height="140" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><rect x="350" y="330" width="290" height="5" rx="2.5" fill="#FFFFFF"/><text x="495" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">orchestrator</text><text x="495" y="382" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">lock, run record, events,</text><text x="495" y="398.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">--resume, rollback, drift,</text><text x="495" y="415.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">policy, a shared backend</text><text x="495" y="432.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">across every job</text><rect x="660" y="330" width="300" height="140" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="660" y="330" width="300" height="5" rx="2.5" fill="#8FA3E8"/><text x="810" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">target plugins</text><text x="810" y="382" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">terraform, ansible, kubernetes, ...</text><text x="810" y="398.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">each compiles its tool&#x27;s own files</text><text x="810" y="415.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">and drives the tool</text><rect x="980" y="330" width="180" height="140" rx="14" fill="#16224F" stroke="#B48CFF" stroke-width="1.5"/><rect x="980" y="330" width="180" height="5" rx="2.5" fill="#B48CFF"/><text x="1070" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">secret delivery</text><text x="1070" y="382" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">each tool&#x27;s own</text><text x="1070" y="398.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">channel; a value</text><text x="1070" y="415.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">is never printed</text><path d="M330 400L350 400" fill="none" stroke="#8FA3E8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M330 400L350 400" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.2s;animation-delay:-0.2s"/><path d="M330 400L350 400" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.2s;animation-delay:-0.2s"/><path d="M640 400L660 400" fill="none" stroke="#8FA3E8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M640 400L660 400" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.2s;animation-delay:-0.6s"/><path d="M640 400L660 400" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.2s;animation-delay:-0.6s"/><path d="M960 400L980 400" fill="none" stroke="#8FA3E8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M960 400L980 400" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.2s;animation-delay:-1s"/><path d="M960 400L980 400" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.2s;animation-delay:-1s"/><path d="M422 156L422 330" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M422 156L422 330" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:-0.3s"/><path d="M422 156L422 330" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:3s;animation-delay:-0.3s"/><text x="410" y="236" text-anchor="end" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">runs meridian apply</text><text x="410" y="254" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">one job, or one job per step</text><path d="M635 156L635 222L1120 222L1120 330" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M635 156L635 222L1120 222L1120 330" fill="none" stroke="#B48CFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:3.4s;animation-delay:-0.9s"/><path d="M635 156L635 222L1120 222L1120 330" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:3.4s;animation-delay:-0.9s"/><text x="1108" y="214" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">env and OIDC: a secret provider</text><path d="M848 156L848 262L560 262L560 330" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M848 156L848 262L560 262L560 330" fill="none" stroke="#FFC857" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:3.4s;animation-delay:-1.4s"/><path d="M848 156L848 262L560 262L560 330" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:3.4s;animation-delay:-1.4s"/><text x="574" y="254" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">gate satisfied by the engine&#x27;s approval</text><path d="M600 330L600 298L1061 298L1061 156" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M600 330L600 298L1061 298L1061 156" fill="none" stroke="#35D0C2" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:3.4s;animation-delay:-0.6s"/><path d="M600 330L600 298L1061 298L1061 156" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:3.4s;animation-delay:-0.6s"/><text x="614" y="316" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">--events json: annotations, summaries, the record</text><path d="M215 330L215 156" fill="none" stroke="#FFC857" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#g-arrow)" opacity=".8"/><text x="227" y="290" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">an emitter plugin writes the job</text><text x="227" y="306" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">skeleton from the Workflow;</text><text x="227" y="322" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">every job still runs meridian</text><rect x="90" y="510" width="1070" height="74" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.2" stroke-dasharray="5 5"/><text x="120" y="536" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">What stays where it is</text><text x="120" y="558" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">Meridian never becomes the engine: no triggers, runners, reviewer lists or log hosting. The engine never does the work itself: no terraform apply in a job, only meridian.</text><text x="600" y="616" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">The engine is a thin shell: it starts the job, holds the secrets and the approval, and keeps the logs. Everything the job does is Meridian&#x27;s.</text>
</svg>
