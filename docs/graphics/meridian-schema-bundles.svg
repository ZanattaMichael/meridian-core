nchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">every machine</text><path d="M630 345L670 345" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M630 345L670 345" fill="none" stroke="#B48CFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1s"/><path d="M630 345L670 345" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1s"/><rect x="940" y="280" width="220" height="130" rx="14" fill="#16224F" stroke="#7EE2A8" stroke-width="1.5"/><rect x="940" y="280" width="220" height="5" rx="2.5" fill="#7EE2A8"/><text x="1050" y="310" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">meridian.lock</text><text x="1050" y="332" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">each bundle by</text><text x="1050" y="348.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">reference and digest;</text><text x="1050" y="365.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">sync --locked takes</text><text x="1050" y="382.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">exactly those</text><path d="M900 345L940 345" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M900 345L940 345" fill="none" stroke="#7EE2A8" stroke-width="6" stroke-linecap="round" opac