" fill="#FFFFFF">meridian.yaml</text><text x="165" y="332" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">spec:</text><text x="165" y="348.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  schemas:</text><text x="165" y="365.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    registry: ghcr.io/…</text><text x="165" y="382.625" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    signatures: require</text><rect x="330" y="280" width="300" height="130" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="330" y="280" width="300" height="5" rx="2.5" fill="#8FA3E8"/><text x="480" y="310" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">meridian schema sync</text><text x="480" y="332" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the types the documents use</text><text x="480" y="348.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">→ the newest bundle that</text><text x="480" y="365.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">describes each, from the index</text><text x="480" y="382.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">→ its signatur