<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Analyzers: a stage compiles, its files are written to a temporary directory, each analyzer scans them and returns findings, and each finding is traced to the document line where its resource starts">
<title>Analyzers: a stage compiles, its files are written to a temporary directory, each analyzer scans them and returns findings, and each finding is traced to the document line where its resource starts</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
