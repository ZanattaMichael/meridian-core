<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="meridian lab: a Lab document&#x27;s matrix expands into cells; each cell provisions, verifies and destroys its environment in a state directory of its own, under its own run id, concurrency at a time; sweep destroys what kept or killed runs left once it expires">
