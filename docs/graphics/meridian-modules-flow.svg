<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Modules: a manifest names what a project needs, install fetches and pins it in the lockfile, and every run verifies the pin without fetching">
<title>Modules: a manifest names what a project needs, install fetches and pins it in the lockfile, and every run verifies the pin without fetching</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
<defs>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA3E8"/></marker>
</defs>
<rect width="1200" height="440" rx="24" fill="url(#g-bg)"/>
<rect x="40" y="60" width="250" height="130" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><rect x="40" y="60" width="250" height="5" rx="2.5" fill="#FFFFFF"/><text x="165" y="90" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">meridian.yaml</text><text x="165" y="112" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">requires:</text><text x="165" y="128.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  acme/nginx: ^1.2</text><text x="165" y="145.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    git: …/modules.git</text><text x="165" y="162.625" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  acme/hardening: 2.x</text><text x="165" y="179.5" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">    oci: ghcr.io/acme/…</text><rect x="350" y="60" width="70" height="28" rx="14" fill="#101A3F" stroke="#6F9BFF" stroke-width="1.2"/><text x="385" y="78.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">path</text><text x="430" y="79" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a directory on disk</text><path d="M290 125C320 125 320 74 350 74" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M290 125C320 125 320 74 350 74" fill="none" stroke="#6F9BFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0s"/><path d="M290 125C320 125 320 74 350 74" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0s"/><rect x="350" y="110" width="70" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="385" y="128.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">git</text><text x="430" y="129" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a repository, by tag or branch</text><path d="M290 125C320 125 320 124 350 124" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M290 125C320 125 320 124 350 124" fill="none" stroke="#FF8A4C" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.5s"/><path d="M290 125C320 125 320 124 350 124" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.5s"/><rect x="350" y="160" width="70" height="28" rx="14" fill="#101A3F" stroke="#35D0C2" stroke-width="1.2"/><text x="385" y="178.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">oci</text><text x="430" y="179" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a container registry</text><path d="M290 125C320 125 320 174 350 174" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M290 125C320 125 320 174 350 174" fill="none" stroke="#35D0C2" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1s"/><path d="M290 125C320 125 320 174 350 174" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1s"/><rect x="640" y="60" width="250" height="130" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="640" y="60" width="250" height="5" rx="2.5" fill="#8FA3E8"/><text x="765" y="90" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">meridian module install</text><text x="765" y="112" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">fetches each module once,</text><text x="765" y="128.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">picks one version per project</text><text x="765" y="145.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">from its SemVer requirement,</text><text x="765" y="162.625" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">runs nothing from it</text><path d="M610 125L640 125" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M610 125L640 125" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.4s"/><path d="M610 125L640 125" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.4s"/><rect x="930" y="60" width="230" height="130" rx="14" fill="#16224F" stroke="#7EE2A8" stroke-width="1.5"/><rect x="930" y="60" width="230" height="5" rx="2.5" fill="#7EE2A8"/><text x="1045" y="90" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">meridian.lock</text><text x="1045" y="112" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">each module pinned by a</text><text x="1045" y="128.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">hash of its content;</text><text x="1045" y="145.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">commit it, never edit it</text><path d="M890 125L930 125" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M890 125L930 125" fill="none" stroke="#7EE2A8" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.8s"/><path d="M890 125L930 125" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-0.8s"/><text x="250" y="238" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">EVERY COMPILE, PLAN AND APPLY</text><rect x="40" y="250" width="340" height="96" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><rect x="40" y="250" width="340" height="5" rx="2.5" fill="#FFFFFF"/><text x="210" y="280" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">verify, never fetch</text><text x="210" y="302" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the hash of each module is checked</text><text x="210" y="318.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">against the lockfile before it is read;</text><text x="210" y="335.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">a change since the pin is refused</text><path d="M1045 190L1045 218L210 218L210 250" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M1045 190L1045 218L210 218L210 250" fill="none" stroke="#7EE2A8" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:3.2s;animation-delay:-0.2s"/><path d="M1045 190L1045 218L210 218L210 250" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:3.2s;animation-delay:-0.2s"/><rect x="420" y="250" width="340" height="96" rx="14" fill="#16224F" stroke="#6F9BFF" stroke-width="1.5"/><rect x="420" y="250" width="340" height="5" rx="2.5" fill="#6F9BFF"/><text x="590" y="280" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">a module&#x27;s file in a document</text><text x="590" y="302" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">@acme/nginx:documents/proxy.yaml</text><text x="590" y="318.875" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">names a file inside the module</text><text x="590" y="335.75" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">for any command to use</text><path d="M380 298L420 298" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M380 298L420 298" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.1s"/><path d="M380 298L420 298" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.1s"/><rect x="800" y="250" width="360" height="96" rx="14" fill="#16224F" stroke="#B48CFF" stroke-width="1.5"/><rect x="800" y="250" width="360" height="5" rx="2.5" fill="#B48CFF"/><text x="980" y="280" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">--module-signatures</text><text x="980" y="302" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">optional: a fetched module must be</text><text x="980" y="318.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">signed by a key you trust;</text><text x="980" y="335.75" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">meridian module sign makes one</text><path d="M760 298L800 298" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M760 298L800 298" fill="none" stroke="#B48CFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.6s"/><path d="M760 298L800 298" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.6s;animation-delay:-1.6s"/><text x="600" y="416" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">There is no central index. A requirement says where its module comes from: your git server, or your container registry.</text>
</svg>
