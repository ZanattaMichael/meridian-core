s reach</text><text x="1104" y="185.6" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">the stages</text><text x="1104" y="201.2" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">that asked</text><path d="M1034 169L1048 169" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M1034 169L1048 169" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-2.64s"/><path d="M1034 169L1048 169" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-2.64s"/><path d="M1104 110C1104 56 474 56 474 110" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M1104 110C1104 56 474 56 474 110" fill="none" stroke="#35D0C2" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:4s;animation-delay:-0.8s"/><path d="M1104 110C1104 56 474 56 474 110" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:4s;animation-delay:-0.8s"/><text x="789" y="44" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9D4FF">an Infrastructure stage&#x27;s outputs become a later stage&#x27;s targetHost</text><text x="40" y="268" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">HOW FAR EACH COMMAND GOES</text><rect x="40" y="282" width="364" height="26" rx="13" fill="#101A3F" stroke="#FFFFFF" stroke-width="1.2"/><rect x="40" y="282" width="364" height="26" rx="13" fill="#FFFFFF" opacity=".12"/><text x="56" y="300" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#FFFFFF">meridian validate</text><text x="418" y="300" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">through step 3: no plugin is loaded: the language only</text><rect x="40" y="318" width="868" height="26" rx="13" fill="#101A3F" stroke="#6F9BFF" stroke-width="1.2"/><rect x="40" y="318" width="868" height="26" rx="13" fill="#6F9BFF" opacity=".12"/><text x="56" y="336" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#FFFFFF">meridian compile</text><text x="894" y="336" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">through step 7: writes each target&#x27;s files, changes nothing</text><rect x="40" y="354" width="994" height="26" rx="13" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><rect x="40" y="354" width="994" height="26" rx="13" fill="#FF8A4C" opacity=".12"/><text x="56" y="372" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#FFFFFF">meridian plan</text><text x="1020" y="372" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">through step 8: asks each tool what applying would change</text><rect x="40" y="390" width="1120" height="26" rx="13" fill="#101A3F" stroke="#35D0C2" stroke-width="1.2"/><rect x="40" y="390" width="1120" height="26" rx="13" fill="#35D0C2" opacity=".12"/><text x="56" y="408" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#FFFFFF">meridian apply</text><text x="1146" y="408" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">through step 9: makes it so, and carries outputs on</text><text x="600" y="446" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">Step 7 is where a target refuses what its tool cannot express. It never writes files that quietly do less.</text>
