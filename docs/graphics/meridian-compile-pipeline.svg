xt><text x="600" y="185.6" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">category and</text><text x="600" y="201.2" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">targetVersion fit</text><path d="M530 169L544 169" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M530 169L544 169" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.32s"/><path d="M530 169L544 169" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.32s"/><rect x="670" y="110" width="112" height="118" rx="14" fill="#16224F" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="692" cy="134" r="13" fill="#FFFFFF"/><text x="692" y="139" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0A112B">6</text><text x="712" y="139" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Order</text><text x="726" y="170" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">every when</text><text x="726" y="185.6" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">decided; sorted</text><text x="726" y="201.2" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">by dependsOn</text><path d="M656 169L670 169" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M656 169L670 169" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.65s"/><path d="M656 169L670 169" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.65s"/><rect x="796" y="110" width="112" height="118" rx="14" fill="#16224F" stroke="#6F9BFF" stroke-width="1.5"/><circle cx="818" cy="134" r="13" fill="#6F9BFF"/><text x="818" y="139" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0A112B">7</text><text x="838" y="139" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Compile</text><text x="852" y="170" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">the plugin writes</text><text x="852" y="185.6" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">the tool&#x27;s</text><text x="852" y="201.2" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">own files</text><path d="M782 169L796 169" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M782 169L796 169" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.98s"/><path d="M782 169L796 169" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.4s;animation-delay:-1.98s"/><rect x="922" y="110" width="112" heig