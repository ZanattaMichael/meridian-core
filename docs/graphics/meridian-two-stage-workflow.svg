<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="The two-stage architecture: an Infrastructure stage creates the machine and promises an output, a ResourceSet stage names that output as its host">
<title>The two-stage architecture: an Infrastructure stage creates the machine and promises an output, a ResourceSet stage names that output as its host</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
<defs>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA3E8"/></marker>
</defs>
<rect width="1200" height="500" rx="24" fill="url(#g-bg)"/>
<text x="40" y="40" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6F9BFF">STAGE 1: WHAT SHOULD EXIST?</text><rect x="40" y="52" width="420" height="250" rx="14" fill="#16224F" stroke="#6F9BFF" stroke-width="1.5"/><rect x="40" y="52" width="420" height="5" rx="2.5" fill="#6F9BFF"/><text x="250" y="84" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#FFFFFF">kind: Infrastructure</text><text x="62" y="116" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">spec:</text><text x="62" y="134.225" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">  target: terraform</text><text x="62" y="152.45" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">  resources:</text><text x="62" y="170.675" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">    - id: net     type: aws_vpc</text><text x="62" y="188.9" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">    - id: web     type: aws_instance</text><text x="62" y="207.125" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">  outputs:</text><text x="62" y="225.35" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">    - name: address</text><text x="62" y="243.575" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">      value: ${web.public_ip}</text><rect x="62" y="258" width="376" height="30" rx="15" fill="#101A3F" stroke="#6F9BFF" stroke-width="1.2"/><text x="250" y="277.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">terraform apply creates the machine and knows its address</text><text x="740" y="40" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FF8A4C">STAGE 2: HOW SHOULD THAT MACHINE BE SET UP?</text><rect x="740" y="52" width="420" height="250" rx="14" fill="#16224F" stroke="#FF8A4C" stroke-width="1.5"/><rect x="740" y="52" width="420" height="5" rx="2.5" fill="#FF8A4C"/><text x="950" y="84" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#FFFFFF">kind: ResourceSet</text><text x="762" y="116" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">spec:</text><text x="762" y="134.225" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">  target: ansible</text><text x="762" y="152.45" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">  targetHost: ${infra.address}</text><text x="762" y="170.675" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">  resources:</text><text x="762" y="188.9" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">    - id: nginx   type: package</text><text x="762" y="207.125" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">    - id: site    type: file</text><text x="762" y="225.35" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">    - id: svc     type: service</text><text x="762" y="243.575" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#C9D4FF">      notifies: [nginx]</text><rect x="762" y="258" width="376" height="30" rx="15" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="950" y="277.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">ansible-playbook logs in to that address and converges it</text><path d="M460 177L740 177" fill="none" stroke="#8FA3E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M460 177L740 177" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:0s"/><path d="M460 177L740 177" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:0s"/><rect x="500" y="150" width="200" height="54" rx="27" fill="#101A3F" stroke="#FFFFFF" stroke-width="1.2"/><text x="600" y="172" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">one declared value</text><text x="600" y="191" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">address = 203.0.113.7</text><text x="40" y="338" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">IN ONE MERIDIAN APPLY</text><path d="M40 378H1160" stroke="#2B3A78" stroke-width="2"/><circle cx="42" cy="378" r="11" fill="#6F9BFF" opacity=".18" class="m-breathe"/><circle cx="42" cy="378" r="5" fill="#6F9BFF"/><text x="42" y="406" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">stage 1 compiled</text><circle cx="302" cy="378" r="11" fill="#6F9BFF" opacity=".18" class="m-breathe"/><circle cx="302" cy="378" r="5" fill="#6F9BFF"/><text x="302" y="406" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">terraform runs to the end</text><path d="M42 378L302 378" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round"/><path d="M42 378L302 378" fill="none" stroke="#6F9BFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.6s"/><path d="M42 378L302 378" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.6s"/><circle cx="562" cy="378" r="11" fill="#FFFFFF" opacity=".18" class="m-breathe"/><circle cx="562" cy="378" r="5" fill="#FFFFFF"/><text x="562" y="406" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the output is read back from the tool</text><path d="M302 378L562 378" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round"/><path d="M302 378L562 378" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1.2s"/><path d="M302 378L562 378" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1.2s"/><circle cx="822" cy="378" r="11" fill="#FF8A4C" opacity=".18" class="m-breathe"/><circle cx="822" cy="378" r="5" fill="#FF8A4C"/><text x="822" y="406" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">stage 2 compiled with the value</text><path d="M562 378L822 378" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round"/><path d="M562 378L822 378" fill="none" stroke="#FF8A4C" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1.8s"/><path d="M562 378L822 378" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1.8s"/><circle cx="1082" cy="378" r="11" fill="#FF8A4C" opacity=".18" class="m-breathe"/><circle cx="1082" cy="378" r="5" fill="#FF8A4C"/><text x="1082" y="406" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">ansible runs</text><path d="M822 378L1082 378" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round"/><path d="M822 378L1082 378" fill="none" stroke="#FF8A4C" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-2.4s"/><path d="M822 378L1082 378" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-2.4s"/><text x="600" y="476" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">Meridian stores no output. It reads each one back from the tool that produced it, and a ResourceSet aimed at Terraform is refused at compile.</text>
</svg>
