<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="meridian diagnose reads the run record, its events and the failures this machine kept, and prints each failed step with its machine, resource and cause, the steps not run because of it, and the command to run next">
<title>meridian diagnose reads the run record, its events and the failures this machine kept, and prints each failed step with its machine, resource and cause, the steps not run because of it, and the command to run next</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
<defs>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA3E8"/></marker>
</defs>
<rect width="1200" height="470" rx="24" fill="url(#g-bg)"/>
<text x="40" y="48" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">WHAT DIAGNOSE READS, AND WHAT IT ANSWERS</text><rect x="40" y="66" width="300" height="56" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="40" y="66" width="300" height="5" rx="2.5" fill="#8FA3E8"/><text x="190" y="96" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">run.json</text><text x="190" y="113" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">each step: status, reason</text><rect x="40" y="136" width="300" height="56" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="40" y="136" width="300" height="5" rx="2.5" fill="#8FA3E8"/><text x="190" y="166" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">events.jsonl</text><text x="190" y="183" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">skipped because of which step</text><rect x="40" y="206" width="300" height="56" rx="14" fill="#16224F" stroke="#8FA3E8" stroke-width="1.5"/><rect x="40" y="206" width="300" height="5" rx="2.5" fill="#8FA3E8"/><text x="190" y="236" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">failures.jsonl</text><text x="190" y="253" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D4FF">resource, cause, summary, line</text><path d="M340 94L420 164" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M340 94L420 164" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0s"/><path d="M340 94L420 164" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0s"/><path d="M340 164L420 164" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M340 164L420 164" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0.3s"/><path d="M340 164L420 164" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0.3s"/><path d="M340 234L420 164" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M340 234L420 164" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0.6s"/><path d="M340 234L420 164" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0.6s"/><rect x="420" y="110" width="200" height="108" rx="14" fill="#16224F" stroke="#7EE2A8" stroke-width="1.5"/><rect x="420" y="110" width="200" height="5" rx="2.5" fill="#7EE2A8"/><text x="520" y="140" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">meridian diagnose</text><text x="520" y="162" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">no tool, no plugin,</text><text x="520" y="178.875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">no lock</text><path d="M620 164L690 164" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M620 164L690 164" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-1s"/><path d="M620 164L690 164" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-1s"/><rect x="690" y="66" width="470" height="196" rx="18" fill="#101A3F" stroke="#FF7A90" stroke-width="1.4"/><rect x="690" y="66" width="470" height="5" rx="2.5" fill="#FF7A90"/><text x="712" y="100" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">web  ansible  203.0.113.10  resource-failed</text><text x="712" y="116.875" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  nginx_conf  &#x27;nginx_port&#x27; is undefined</text><text x="712" y="133.75" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  next: meridian logs &lt;run&gt; --step web</text><text x="712" y="150.625" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">web  ansible  37 machines  unreachable</text><text x="712" y="167.5" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">  next: check the 37 machines can be reached</text><text x="712" y="184.375" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF"></text><text x="712" y="201.25" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9D4FF">not run: app, dns (earlier-step-failed: web)</text><text x="40" y="340" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">THEN, IN THE ORDER A PERSON REACHES FOR THEM</text><rect x="40" y="356" width="265" height="28" rx="14" fill="#101A3F" stroke="#7EE2A8" stroke-width="1.2"/><text x="172.5" y="374.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">diagnose</text><text x="172.5" y="404" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">what broke and where</text><rect x="325" y="356" width="265" height="28" rx="14" fill="#101A3F" stroke="#8FA3E8" stroke-width="1.2"/><text x="457.5" y="374.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">logs</text><text x="457.5" y="404" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the tool&#x27;s own words</text><path d="M305 370L325 370" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M305 370L325 370" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0.4s"/><path d="M305 370L325 370" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0.4s"/><rect x="610" y="356" width="265" height="28" rx="14" fill="#101A3F" stroke="#FF8A4C" stroke-width="1.2"/><text x="742.5" y="374.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">--tool-debug</text><text x="742.5" y="404" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">the tool, more verbose</text><path d="M590 370L610 370" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M590 370L610 370" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0.8s"/><path d="M590 370L610 370" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-0.8s"/><rect x="895" y="356" width="265" height="28" rx="14" fill="#101A3F" stroke="#6F9BFF" stroke-width="1.2"/><text x="1027.5" y="374.68" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFFFF">apply --resume</text><text x="1027.5" y="404" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C9D4FF">carry on from the failure</text><path d="M875 370L895 370" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M875 370L895 370" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-1.2s"/><path d="M875 370L895 370" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:1.8s;animation-delay:-1.2s"/><text x="600" y="446" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">The failed step comes first; the steps it stopped are named under it, and each machine gets the command to run next.</text>
</svg>
