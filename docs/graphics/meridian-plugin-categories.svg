<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Which kind of document each plugin category takes: Infrastructure for infrastructure as code, containers and orchestration; ResourceSet for configuration management; Workflow for pipelines; docker takes both of the first two">
<title>Which kind of document each plugin category takes: Infrastructure for infrastructure as code, containers and orchestration; ResourceSet for configuration management; Workflow for pipelines; docker takes both of the first two</title>
<style>.m-flow{stroke-dasharray:12 88;stroke-dashoffset:0;animation:m-travel var(--m-time,3s) linear infinite}
.m-flow.m-back{animation-direction:reverse}
.m-breathe{animation:m-breathe 3.2s ease-in-out infinite}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m-flow{display:none}.m-breathe{animation:none;opacity:.85}}</style>
<defs>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA3E8"/></marker>
</defs>
<rect width="1200" height="470" rx="24" fill="url(#g-bg)"/>
<text x="40" y="40" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">THREE KINDS OF DOCUMENT</text><rect x="40" y="52" width="320" height="100" rx="14" fill="#16224F" stroke="#6F9BFF" stroke-width="1.5"/><rect x="40" y="52" width="320" height="5" rx="2.5" fill="#6F9BFF"/><text x="200" y="82" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">kind: Infrastructure</text><text x="200" y="104" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#C9D4FF">what should exist?</text><text x="200" y="122.225" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#C9D4FF">creates things through an API,</text><text x="200" y="140.45" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#C9D4FF">keeps track of them, promises outputs</text><rect x="40" y="182" width="320" height="100" rx="14" fill="#16224F" stroke="#FF8A4C" stroke-width="1.5"/><rect x="40" y="182" width="320" height="5" rx="2.5" fill="#FF8A4C"/><text x="200" y="212" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">kind: ResourceSet</text><text x="200" y="234" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#C9D4FF">how should this machine be set up?</text><text x="200" y="252.225" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#C9D4FF">logs in to a machine that exists,</text><text x="200" y="270.45" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#C9D4FF">converges packages, files, services</text><rect x="40" y="312" width="320" height="100" rx="14" fill="#16224F" stroke="#FFC857" stroke-width="1.5"/><rect x="40" y="312" width="320" height="5" rx="2.5" fill="#FFC857"/><text x="200" y="342" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">kind: Workflow</text><text x="200" y="364" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#C9D4FF">in what order, on what, with what gates?</text><text x="200" y="382.225" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#C9D4FF">steps over the other documents;</text><text x="200" y="400.45" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#C9D4FF">an engine&#x27;s job runs each step</text><text x="560" y="40" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8FA3E8">FIVE CATEGORIES A PLUGIN CAN DECLARE</text><rect x="560" y="52" width="600" height="56" rx="14" fill="#16224F" stroke="#6F9BFF" stroke-width="1.5"/><rect x="560" y="52" width="5" height="56" rx="2.5" fill="#6F9BFF"/><text x="590" y="76" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6F9BFF">Infrastructure as code</text><text x="590" y="97" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#C9D4FF">terraform, opentofu, cloudformation, bicep, arm, pulumi, packer</text><rect x="560" y="122" width="600" height="56" rx="14" fill="#16224F" stroke="#35D0C2" stroke-width="1.5"/><rect x="560" y="122" width="5" height="56" rx="2.5" fill="#35D0C2"/><text x="590" y="146" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#35D0C2">Containers</text><text x="590" y="167" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#C9D4FF">docker takes either kind; podman</text><rect x="560" y="192" width="600" height="56" rx="14" fill="#16224F" stroke="#B48CFF" stroke-width="1.5"/><rect x="560" y="192" width="5" height="56" rx="2.5" fill="#B48CFF"/><text x="590" y="216" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B48CFF">Orchestration</text><text x="590" y="237" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#C9D4FF">kubernetes, helm</text><rect x="560" y="262" width="600" height="56" rx="14" fill="#16224F" stroke="#FF8A4C" stroke-width="1.5"/><rect x="560" y="262" width="5" height="56" rx="2.5" fill="#FF8A4C"/><text x="590" y="286" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FF8A4C">Configuration management</text><text x="590" y="307" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#C9D4FF">ansible, puppet, openvox, chef, salt, dsc, cloud-init</text><rect x="560" y="332" width="600" height="56" rx="14" fill="#16224F" stroke="#FFC857" stroke-width="1.5"/><rect x="560" y="332" width="5" height="56" rx="2.5" fill="#FFC857"/><text x="590" y="356" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFC857">Pipelines</text><text x="590" y="377" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#C9D4FF">github-actions, azure-pipelines, gitlab-ci, buildkite, argo, octopus</text><path d="M360 102C460 102 460 80 560 80" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M360 102C460 102 460 80 560 80" fill="none" stroke="#6F9BFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:0s"/><path d="M360 102C460 102 460 80 560 80" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:0s"/><path d="M360 102C460 102 460 150 560 150" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M360 102C460 102 460 150 560 150" fill="none" stroke="#6F9BFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.6s"/><path d="M360 102C460 102 460 150 560 150" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.6s"/><path d="M360 102C460 102 460 220 560 220" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M360 102C460 102 460 220 560 220" fill="none" stroke="#6F9BFF" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1.2s"/><path d="M360 102C460 102 460 220 560 220" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1.2s"/><path d="M360 232C460 232 460 290 560 290" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M360 232C460 232 460 290 560 290" fill="none" stroke="#FF8A4C" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.3s"/><path d="M360 232C460 232 460 290 560 290" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.3s"/><path d="M360 232C460 232 460 150 560 150" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M360 232C460 232 460 150 560 150" fill="none" stroke="#FF8A4C" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1.5s"/><path d="M360 232C460 232 460 150 560 150" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-1.5s"/><path d="M360 362C460 362 460 360 560 360" fill="none" stroke="#8FA3E8" stroke-width="2" stroke-linecap="round" marker-end="url(#g-arrow)"/><path d="M360 362C460 362 460 360 560 360" fill="none" stroke="#FFC857" stroke-width="6" stroke-linecap="round" opacity=".45" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.9s"/><path d="M360 362C460 362 460 360 560 360" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="m-flow" style="--m-time:2.4s;animation-delay:-0.9s"/><text x="600" y="446" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9D4FF">A document aimed at a category that does not take its kind is refused at compile, with the reason. Each plugin declares which it is.</text>
</svg>
