<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Meridian: one DSL for everything">
<style>.m-light{stroke-dasharray:14 86;animation:m-travel 2.6s linear infinite}
.m-glow{stroke-dasharray:14 86;opacity:.5;animation:m-travel 2.6s linear infinite}
.m-point{animation:m-breathe 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes m-travel{to{stroke-dashoffset:-100}}
@keyframes m-breathe{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.m-light,.m-glow{display:none}.m-point{animation:none}}</style><title>Meridian: one DSL for everything</title>
<defs>
<linearGradient id="mb-bg-dark-animated" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357A"/><stop offset="1" stop-color="#0A112B"/></linearGradient>
<clipPath id="mb-clip-dark-animated"><rect width="1280" height="320" rx="24"/></clipPath>
</defs>
<g clip-path="url(#mb-clip-dark-animated)">
<rect width="1280" height="320" fill="url(#mb-bg-dark-animated)"/>
<g fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".10" stroke-linecap="round"><path d="M930 160A260 101 0 0 0 1450 160"/><path d="M930 160A260 101 0 0 1 1450 160"/><path d="M930 160H1280"/></g>
<g fill="none" stroke-width="9" stroke-linecap="round"><path d="M930 160A260 150 0 0 1 1450 160" stroke="#6F9BFF"/><path d="M930 160A260 52 0 0 1 1450 160" stroke="#FF8A4C"/><path d="M930 160A260 52 0 0 0 1450 160" stroke="#35D0C2"/><path d="M930 160A260 150 0 0 0 1450 160" stroke="#B48CFF"/><path d="M930 160H1450" stroke="#FFC857"/></g>
<g fill="none" stroke-linecap="round"><path d="M930 160A260 150 0 0 1 1450 160" stroke="#6F9BFF" stroke-width="10" pathLength="100" class="m-glow" style="animation-delay:0s"/><path d="M930 160A260 150 0 0 1 1450 160" stroke="#FFFFFF" stroke-width="5" pathLength="100" class="m-light" style="animation-delay:0s"/><path d="M930 160A260 52 0 0 1 1450 160" stroke="#FF8A4C" stroke-width="10" pathLength="100" class="m-glow" style="animation-delay:-0.52s"/><path d="M930 160A260 52 0 0 1 1450 160" stroke="#FFFFFF" stroke-width="5" pathLength="100" class="m-light" style="animation-delay:-0.52s"/><path d="M930 160A260 52 0 0 0 1450 160" stroke="#35D0C2" stroke-width="10" pathLength="100" class="m-glow" style="animation-delay:-1.04s"/><path d="M930 160A260 52 0 0 0 1450 160" stroke="#FFFFFF" stroke-width="5" pathLength="100" class="m-light" style="animation-delay:-1.04s"/><path d="M930 160A260 150 0 0 0 1450 160" stroke="#B48CFF" stroke-width="10" pathLength="100" class="m-glow" style="animation-delay:-1.56s"/><path d="M930 160A260 150 0 0 0 1450 160" stroke="#FFFFFF" stroke-width="5" pathLength="100" class="m-light" style="animation-delay:-1.56s"/><path d="M930 160H1450" stroke="#FFC857" stroke-width="10" pathLength="100" class="m-glow" style="animation-delay:-2.08s"/><path d="M930 160H1450" stroke="#FFFFFF" stroke-width="5" pathLength="100" class="m-light" style="animation-delay:-2.08s"/></g><circle cx="930" cy="160" r="32.3" fill="#FFFFFF" class="m-point"/><circle cx="930" cy="160" r="17" fill="#FFFFFF"/>
</g>

<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<text x="70" y="136" font-size="88" font-weight="700" letter-spacing="-2" fill="#FFFFFF">Meridian</text>
<text x="72" y="190" font-size="30" font-weight="600" fill="#FFFFFF">One DSL for everything.</text>
<text x="72" y="224" font-size="19" fill="#C9D4FF">Write it once. Compile it to the tools you already run.</text>
<circle cx="79" cy="262" r="7" fill="#6F9BFF"/><text x="96" y="268" font-size="17" fill="#E6EBFF">Infrastructure as code</text><circle cx="307" cy="262" r="7" fill="#FF8A4C"/><text x="324" y="268" font-size="17" fill="#E6EBFF">Configuration management</text><circle cx="565" cy="262" r="7" fill="#35D0C2"/><text x="582" y="268" font-size="17" fill="#E6EBFF">Containers</text><circle cx="703" cy="262" r="7" fill="#B48CFF"/><text x="720" y="268" font-size="17" fill="#E6EBFF">Orchestration</text><circle cx="861" cy="262" r="7" fill="#FFC857"/><text x="878" y="268" font-size="17" fill="#E6EBFF">Pipelines</text>
</g>
</svg>
