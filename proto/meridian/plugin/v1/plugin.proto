// Meridian's plugin protocol: the wire form of the design plan's §11.4 Emitter
// interface.
//
// The protocol has two services. Emitter carries a compiled resource tree to a
// plugin and carries back the artifact that tree compiles to; it has no side
// effects. Runner hands an artifact to the real tool to preview or apply it,
// and reports what the tool produced. They are separate services on purpose:
// compiling stays a pure function over Emitter alone, and a plugin that only
// compiles never has to mention Runner.
//
// Version 2 added the plugin's category and operations to Describe, and the
// Runner service.
//
// Importer is a third, optional service: it reads a tool's existing
// configuration and returns the Meridian documents that describe the same
// thing. A plugin that serves it lists the formats it reads in Describe. It
// was added without changing the protocol version, because a plugin built
// before it existed lists no formats and is simply never asked.
syntax = "proto3";

package meridian.plugin.v1;

// Position is a point in a source document, carried so a failure raised inside
// a plugin can still be reported against the line the author wrote.
message Position {
  string file = 1;
  int32 doc_idx = 2;
  int32 line = 3;
  int32 column = 4;
}

// Resource is one unconditional unit of desired state. Every compile-time
// `when` has already been evaluated before a tree reaches this protocol, so a
// plugin never has to reason about whether a resource will really be applied.
message Resource {
  string id = 1;
  string type = 2;
  string state = 3;

  // params_json is the resource's parameters as a JSON object.
  //
  // It is JSON bytes rather than google.protobuf.Struct because Struct models
  // every number as a double: a port of 8080 would arrive as 8080.0 and change
  // the emitted artifact. Deterministic, byte-identical compilation is a
  // guiding principle, so the wire format preserves integers.
  bytes params_json = 4;

  // runtime_when is a condition evaluated on the node at apply time. Only a
  // target whose capabilities include runtime_condition may accept one.
  string runtime_when = 5;

  // index is the resource's declaration order in the source document, kept so a
  // target that reorders resources still has the original tiebreak.
  int32 index = 6;

  Position pos = 7;
}

// EdgeKind keeps an ordering constraint and a deferred trigger structurally
// distinct, because they are not the same concept and targets compile them
// differently.
enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  // dependsOn: `from` must be applied before `to`.
  EDGE_KIND_HARD_ORDER = 1;
  // notifies: `to` is triggered if `from` reports a change. It constrains
  // nothing about apply order.
  EDGE_KIND_NOTIFY = 2;
}

message Edge {
  string from = 1;
  string to = 2;
  EdgeKind kind = 3;
  // action is the notify action, for example "restart"; empty for an ordering
  // edge.
  string action = 4;
  Position pos = 5;
}

// OutputDeclaration is a value a document promises to later stages, such as
// the address of a machine it provisions. The plugin compiles it into the
// tool's own output mechanism and reports its value, under the same name,
// from Apply and Outputs.
message OutputDeclaration {
  string name = 1;
  // value is the expression the author wrote, for example
  // "${web_vm.public_ip}": a reference to an attribute of a resource in this
  // document, which only the tool can resolve.
  string value = 2;
  Position pos = 3;
}

// ResourceGraph is a whole compiled document: its resources in deterministic
// apply order, the edges between them, and the host they configure.
message ResourceGraph {
  string name = 1;
  // host is the node a host-configuration document applies to. It is empty for
  // a document that provisions infrastructure.
  string host = 2;
  string target = 3;
  repeated Resource resources = 4;
  repeated Edge edges = 5;
  // outputs is what the document promises to later stages.
  repeated OutputDeclaration outputs = 6;
  // target_version is the document's spec.targetVersion: the version of the
  // tool the author wants the document compiled for. It is empty when the
  // document does not ask for one. The host has already checked it against
  // the versions the plugin declares in Describe.
  string target_version = 7;
}

// Capabilities is a target's honest declaration of what it can express. It is
// the mechanism behind the no-silent-capability-loss principle.
message Capabilities {
  bool native_notify = 1;
  bool synthetic_notify = 2;
  bool runtime_condition = 3;
}

// Artifact is the complete output of a compile: relative path to file content.
// It is data rather than files on disk, which is what lets a plan be pure.
message Artifact {
  map<string, string> files = 1;
}

// Warning is a compile-time notice that does not fail the build but changes
// what an operator should expect from the artifact.
message Warning {
  string target = 1;
  string resource = 2;
  string msg = 3;
}

// CompileError is a target refusing to compile something.
//
// It travels as a field of a successful response rather than as a gRPC status
// error on purpose: a target rejecting a resource type it cannot express is the
// capability contract working as designed, not a fault. Status errors stay
// reserved for genuine transport and plugin failures, so a host can tell the
// two apart.
message CompileError {
  string resource = 1;
  string rule = 2;
  string msg = 3;
  Position pos = 4;
}

// Category is the kind of tool a plugin drives. The core routes on it, to
// decide which workflows a plugin can join and where in one it sits. It is a
// declared fact, never a reason for the core to special-case a product.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  // Provisions infrastructure: Terraform, Bicep, CloudFormation.
  CATEGORY_INFRASTRUCTURE_AS_CODE = 1;
  // Configures a node that already exists: Ansible, Puppet, Chef, DSC.
  CATEGORY_CONFIGURATION_MANAGEMENT = 2;
  // Builds and runs containers on one host: Docker.
  CATEGORY_CONTAINERIZATION = 3;
  // Schedules containers across a cluster: Kubernetes.
  CATEGORY_CONTAINER_ORCHESTRATION = 4;
}

// Operations is a plugin's type: what it can do for the core beyond compiling.
// Every plugin compiles. A plugin that sets any field here also serves Runner,
// and a host never calls a Runner method whose field is false.
message Operations {
  // plan: preview what applying an artifact would change, changing nothing.
  bool plan = 1;
  // apply: make the artifact's desired state real.
  bool apply = 2;
  // outputs: report named values the tool produced, for later stages to use.
  bool outputs = 3;
}

message DescribeRequest {}

message DescribeResponse {
  // protocol_version is the wire protocol the plugin speaks. A host refuses a
  // version it does not implement rather than guessing.
  uint32 protocol_version = 1;
  // sdk_version is the SDK the plugin was compiled against, reported rather
  // than inferred, per the release policy.
  string sdk_version = 2;
  string name = 3;
  // resource_types lists every IR resource type this target maps, sorted.
  repeated string resource_types = 4;
  Capabilities capabilities = 5;
  Category category = 6;
  Operations operations = 7;
  // target_versions lists the versions of its tool the plugin compiles for,
  // such as "3" or "1.9". A document's spec.targetVersion must be one of
  // them, or a more specific version under one of them ("3.1" under "3"). A
  // plugin that lists none does not say, and the host then refuses a document
  // that asks for a version rather than pretend to honour it. A plugin built
  // before this field existed reports none, so the protocol version did not
  // change.
  repeated string target_versions = 8;
  // import_formats lists the kinds of existing configuration the plugin can
  // turn into Meridian documents. A plugin that lists any also serves
  // Importer; a plugin that lists none is never asked to import.
  repeated ImportFormat import_formats = 9;
  // accepts_inputs says the plugin hands RunContext.inputs to its tool, as
  // the tool's own variables or parameters. A document that declares
  // spec.imports is refused for a plugin that does not say so, because the
  // values would otherwise be dropped without a word. A plugin built before
  // this field existed reports false, so the protocol version did not change.
  bool accepts_inputs = 10;
}

message EmitRequest {
  ResourceGraph graph = 1;
  // data_json is the resolved hierarchy data as a JSON object, carried for the
  // same reason params are: to preserve the value types the author wrote.
  bytes data_json = 2;
}

message EmitResponse {
  Artifact artifact = 1;
  repeated Warning warnings = 2;
  // error is set when the target could not compile the tree. When it is set,
  // artifact and warnings are meaningless.
  CompileError error = 3;
}

// Emitter compiles a target-agnostic resource tree into one target's native
// syntax. It has no side effects.
service Emitter {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Emit(EmitRequest) returns (EmitResponse);
}

// RunContext is what every Runner call needs to know about where it runs.
message RunContext {
  // document is the name of the document the artifact was compiled from.
  string document = 1;
  // host is the node the artifact configures; empty for a document that
  // provisions infrastructure instead of configuring a host.
  string host = 2;
  // work_dir is a directory the host created for this document and target and
  // keeps between runs. The plugin writes the artifact there and may keep the
  // tool's own state in it (a Terraform state file, say). The host never reads
  // or interprets what a plugin leaves in it.
  string work_dir = 3;
  // inputs_json is a JSON object of values handed to this stage from the
  // outputs of earlier ones, keyed by the name the document gave them.
  bytes inputs_json = 4;
}

// ChangeAction is what the tool would do, or did, to one thing it manages.
enum ChangeAction {
  CHANGE_ACTION_UNSPECIFIED = 0;
  CHANGE_ACTION_CREATE = 1;
  CHANGE_ACTION_UPDATE = 2;
  CHANGE_ACTION_DELETE = 3;
  // Destroyed and created again, which is worth telling apart from an update
  // because it is the one that loses data.
  CHANGE_ACTION_REPLACE = 4;
}

// Change is one difference between desired and actual state.
message Change {
  // resource is the IR resource id when the tool's report can be traced back
  // to one, and otherwise the tool's own name for what changes.
  string resource = 1;
  ChangeAction action = 2;
  // summary is one line a person can read, in the tool's own terms.
  string summary = 3;
}

// Output is a named value the tool produced.
message Output {
  string name = 1;
  // value_json is the value as JSON, for the same reason params are: to keep
  // the type the tool reported.
  bytes value_json = 2;
  // sensitive marks a value that must be masked wherever it is shown or
  // logged. It must survive every hop to the stage that consumes it.
  bool sensitive = 3;
}

// RunError is the tool failing: a non-zero exit, a rejected configuration, an
// unreachable node.
//
// Like CompileError it travels inside a successful response. A failed apply is
// an answer about the infrastructure, not a fault in the plugin, and a host
// must be able to tell "Terraform said no" from "the plugin crashed".
message RunError {
  string msg = 1;
  // command is what the plugin ran, with any secret arguments removed.
  string command = 2;
  // exit_code is the tool's exit status; meaningful only when exited is true,
  // since a tool that could not be started at all has none.
  int32 exit_code = 3;
  bool exited = 4;
  // output is the end of what the tool printed, enough to explain the failure
  // without the whole log.
  string output = 5;
}

// LogLine is one line of the tool's own output, relayed while it runs.
message LogLine {
  enum Stream {
    STREAM_UNSPECIFIED = 0;
    STREAM_STDOUT = 1;
    STREAM_STDERR = 2;
  }
  Stream stream = 1;
  string text = 2;
}

message PlanRequest {
  RunContext context = 1;
  Artifact artifact = 2;
}

// PlanResult is the preview. Either error is set, or changes is the complete
// list of what an apply would do; an empty list means nothing would change.
message PlanResult {
  repeated Change changes = 1;
  // unknown is true when the tool cannot preview: it says only that something
  // might change, or cannot say at all. A host must not read an empty changes
  // list as "in sync" when it is set.
  bool unknown = 2;
  RunError error = 3;
}

message ApplyRequest {
  RunContext context = 1;
  Artifact artifact = 2;
}

// ApplyResult is what an apply did. When error is set, changes lists what was
// done before the failure, as far as the tool reported it.
message ApplyResult {
  repeated Change changes = 1;
  repeated Output outputs = 2;
  RunError error = 3;
}

// PlanEvent and ApplyEvent are what a run streams back: any number of log
// lines, then exactly one result as the last message. A stream that ends
// without a result is a plugin failure.
message PlanEvent {
  oneof event {
    LogLine log = 1;
    PlanResult result = 2;
  }
}

message ApplyEvent {
  oneof event {
    LogLine log = 1;
    ApplyResult result = 2;
  }
}

message OutputsRequest {
  RunContext context = 1;
}

message OutputsResponse {
  repeated Output outputs = 1;
  RunError error = 2;
}

// Runner hands an artifact to the real tool. Unlike Emitter it has side
// effects, takes as long as the tool takes, and can fail for reasons that have
// nothing to do with the document. Plan and Apply stream, so an operator sees
// the tool's output as it happens and not after a twenty-minute silence.
service Runner {
  // Plan previews what Apply would change. It changes nothing.
  rpc Plan(PlanRequest) returns (stream PlanEvent);
  // Apply makes the artifact's desired state real.
  rpc Apply(ApplyRequest) returns (stream ApplyEvent);
  // Outputs reports the values the last apply produced, read from the tool's
  // own state, without applying anything.
  rpc Outputs(OutputsRequest) returns (OutputsResponse);
}

// ImportFormat is one kind of existing configuration a plugin can read, such
// as Terraform's HCL or a Compose file.
message ImportFormat {
  // name is a short word for the format, such as "hcl" or "compose".
  string name = 1;
  // description is one line a person can read in a listing.
  string description = 2;
  // patterns are the file names the format usually has, as globs over the
  // file's base name: "*.tf", "compose.yaml". The host uses them to gather a
  // directory's files and to guess which plugin a file belongs to. They are a
  // hint, never a guarantee: the plugin still decides what it can read.
  repeated string patterns = 3;
}

message ImportRequest {
  // files is the configuration to read: path, relative to what the operator
  // named, to the file's text.
  map<string, string> files = 1;
  // name is what the operator wants the imported document called. When the
  // source yields several documents the plugin derives each one's name from
  // it. Empty lets the plugin choose.
  string name = 2;
  // root is the directory the files were read from, as an absolute path on
  // the operator's machine; empty when they did not come from one place. The
  // plugin never reads it. It is there for a configuration whose meaning
  // depends on where it is, such as one that names files beside itself.
  string root = 3;
}

// ImportedResource is one resource of an imported document, in the terms a
// Meridian document is written in.
message ImportedResource {
  string id = 1;
  string type = 2;
  string state = 3;
  // params_json is the resource's params as a JSON object, for the same
  // reason Resource.params_json is JSON: to keep the value types.
  bytes params_json = 4;
  // depends_on lists the ids of the resources this one must follow.
  repeated string depends_on = 5;
  repeated ImportedNotify notifies = 6;
  string runtime_when = 7;
  // origin says where in the source the resource came from, such as
  // "main.tf:12". It is written beside the resource as a comment.
  string origin = 8;
}

message ImportedNotify {
  string resource = 1;
  string action = 2;
}

message ImportedOutput {
  string name = 1;
  string value = 2;
}

// DocumentKind is which of Meridian's document kinds an imported document is.
enum DocumentKind {
  DOCUMENT_KIND_UNSPECIFIED = 0;
  // Provisions things: an Infrastructure document.
  DOCUMENT_KIND_INFRASTRUCTURE = 1;
  // Configures a host that exists: a ResourceSet document.
  DOCUMENT_KIND_RESOURCE_SET = 2;
}

// ImportedDocument is one Meridian document, as data. The host writes it out
// in the language's current syntax, so a plugin never has to know how a
// document is spelled.
message ImportedDocument {
  DocumentKind kind = 1;
  string name = 2;
  // target is the target the document selects; empty means the plugin that
  // imported it.
  string target = 3;
  string target_version = 4;
  // host is the node a ResourceSet configures; empty when the source does not
  // name one.
  string host = 5;
  repeated ImportedResource resources = 6;
  repeated ImportedOutput outputs = 7;
}

// NoteLevel says how much an importer's note should worry the operator.
enum NoteLevel {
  NOTE_LEVEL_UNSPECIFIED = 0;
  // Carried over faithfully; the note explains how.
  NOTE_LEVEL_INFO = 1;
  // Carried over, but not as the source wrote it. The document may behave
  // differently and should be reviewed.
  NOTE_LEVEL_CHANGED = 2;
  // Not carried over at all. The document does less than the source did until
  // someone writes the missing part.
  NOTE_LEVEL_UNTRANSLATED = 3;
}

// ImportNote is one thing the importer wants the operator to know. Nothing
// the source says may be dropped without one: a note of level CHANGED or
// UNTRANSLATED becomes a TODO marker in the written document.
message ImportNote {
  NoteLevel level = 1;
  // origin says where in the source the note is about, such as "main.tf:12".
  string origin = 2;
  // subject names the thing, in the source's own terms: `variable "region"`,
  // `task "Install nginx"`.
  string subject = 3;
  string msg = 4;
  // document is the name of the imported document the note belongs to; empty
  // when it is about the import as a whole.
  string document = 5;
  // resource is the id of the imported resource the note belongs to; empty
  // when it is about the document.
  string resource = 6;
}

// ImportError is the importer being unable to read the source at all: a
// syntax error, or a file that is not this tool's. Like CompileError it
// travels inside a successful response, because it is an answer about the
// source and not a fault in the plugin.
message ImportError {
  string msg = 1;
  string file = 2;
  // line is 1-based; zero when unknown.
  int32 line = 3;
}

message ImportResponse {
  repeated ImportedDocument documents = 1;
  repeated ImportNote notes = 2;
  // error is set when nothing could be imported. When it is set, documents
  // and notes are meaningless.
  ImportError error = 3;
}

// Importer turns a tool's existing configuration into Meridian documents. It
// has no side effects: it reads the text it is given and nothing else.
service Importer {
  rpc Import(ImportRequest) returns (ImportResponse);
}
