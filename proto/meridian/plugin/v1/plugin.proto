// Meridian's plugin protocol: the wire form of the design plan's §11.4 Emitter
// interface.
//
// The protocol has two services. Emitter carries a compiled resource tree to a
// plugin and carries back the artifact that tree compiles to; it has no side
// effects. Runner hands an artifact to the real tool to preview or apply it,
// and reports what the tool produced. They are separate services on purpose:
// compiling stays a pure function over Emitter alone, and a plugin that only
// compiles never has to mention Runner.
//
// Version 2 added the plugin's category and operations to Describe, and the
// Runner service.
//
// Importer is a third, optional service: it reads a tool's existing
// configuration and returns the Meridian documents that describe the same
// thing. A plugin that serves it lists the formats it reads in Describe. It
// was added without changing the protocol version, because a plugin built
// before it existed lists no formats and is simply never asked.
//
// SchemaSource is a fourth, optional service: it asks the installed tool for
// the schemas of the resource types a document uses, so that editors can
// complete and check a tool's own types ahead of a compile. A plugin that
// serves it says so in Describe; one built before it existed does not, and
// is never asked.
syntax = "proto3";

package meridian.plugin.v1;

// Position is a point in a source document, carried so a failure raised inside
// a plugin can still be reported against the line the author wrote.
message Position {
  string file = 1;
  int32 doc_idx = 2;
  int32 line = 3;
  int32 column = 4;
}

// Resource is one unconditional unit of desired state. Every compile-time
// `when` has already been evaluated before a tree reaches this protocol, so a
// plugin never has to reason about whether a resource will really be applied.
message Resource {
  string id = 1;
  string type = 2;
  string state = 3;

  // params_json is the resource's parameters as a JSON object.
  //
  // It is JSON bytes rather than google.protobuf.Struct because Struct models
  // every number as a double: a port of 8080 would arrive as 8080.0 and change
  // the emitted artifact. Deterministic, byte-identical compilation is a
  // guiding principle, so the wire format preserves integers.
  bytes params_json = 4;

  // runtime_when is a condition evaluated on the node at apply time. Only a
  // target whose capabilities include runtime_condition may accept one.
  string runtime_when = 5;

  // index is the resource's declaration order in the source document, kept so a
  // target that reorders resources still has the original tiebreak.
  int32 index = 6;

  Position pos = 7;

  // secret_params says where in params_json a secret stands. Each entry
  // names a path into the object (keys, and list indexes as decimal
  // strings) at which params_json holds the placeholder "(sensitive)", and
  // the slot of the secret that belongs there, one of ResourceGraph.secrets.
  // The bytes of the secret never travel with the graph: a plugin writes a
  // reference to the secret into its artifact, and is handed the value when
  // it runs, in RunContext.secrets. Only a target whose capabilities include
  // secrets is sent one.
  repeated SecretParam secret_params = 8;

  // adopt is the tool's own identifier of a thing that already exists, for
  // the tool to take under management instead of creating it. Empty for a
  // resource created as usual. Only a target whose capabilities.adopt is not
  // ADOPTION_NONE is sent one.
  string adopt = 9;
}

// SecretParam is one place in a resource's params where a secret stands.
message SecretParam {
  repeated string path = 1;
  uint32 slot = 2;
}

// SecretName names one secret a graph's params refer to, by the slot that
// Resource.secret_params and RunContext.secrets use for it. The name is the
// one the document declared it under, so a plugin can write a reference
// the operator recognises, such as a variable called after it.
message SecretName {
  uint32 slot = 1;
  string name = 2;
}

// EdgeKind keeps an ordering constraint and a deferred trigger structurally
// distinct, because they are not the same concept and targets compile them
// differently.
enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  // dependsOn: `from` must be applied before `to`.
  EDGE_KIND_HARD_ORDER = 1;
  // notifies: `to` is triggered if `from` reports a change. It constrains
  // nothing about apply order.
  EDGE_KIND_NOTIFY = 2;
}

message Edge {
  string from = 1;
  string to = 2;
  EdgeKind kind = 3;
  // action is the notify action, for example "restart"; empty for an ordering
  // edge.
  string action = 4;
  Position pos = 5;
}

// OutputDeclaration is a value a document promises to later stages, such as
// the address of a machine it provisions. The plugin compiles it into the
// tool's own output mechanism and reports its value, under the same name,
// from Apply and Outputs.
message OutputDeclaration {
  string name = 1;
  // value is the expression the author wrote, for example
  // "${web_vm.public_ip}": a reference to an attribute of a resource in this
  // document, which only the tool can resolve.
  string value = 2;
  Position pos = 3;
}

// ResourceGraph is a whole compiled document: its resources in deterministic
// apply order, the edges between them, and the host they configure.
message ResourceGraph {
  string name = 1;
  // host is the node a host-configuration document applies to. It is empty for
  // a document that provisions infrastructure.
  string host = 2;
  string target = 3;
  repeated Resource resources = 4;
  repeated Edge edges = 5;
  // outputs is what the document promises to later stages.
  repeated OutputDeclaration outputs = 6;
  // target_version is the document's spec.targetVersion: the version of the
  // tool the author wants the document compiled for. It is empty when the
  // document does not ask for one. The host has already checked it against
  // the versions the plugin declares in Describe.
  string target_version = 7;
  // secrets names every secret the resources' params refer to. Empty for a
  // graph without one.
  repeated SecretName secrets = 8;
  // credential is the identity the host is reached with, when the document
  // names one. It holds the credential's plain fields and the names of its
  // secret fields, never a value: the values arrive in RunContext.credential
  // for Plan and Apply. Sent only to a target whose capabilities include
  // credentials.
  Credential credential = 9;
  // settings_json is the document's spec.settings as a JSON object: the
  // tool's own settings for the whole document, such as the engine that runs
  // it. JSON bytes for the same reason Resource.params_json is. Empty when
  // the document sets none. The SDK refuses a key the emitter does not list
  // in settings_keys before emit is called.
  bytes settings_json = 10;
}

// Credential is an identity a document declares, as a compile sees it: its
// name, its type, its plain fields and which of its fields hold secret
// material. It holds no secret.
message Credential {
  string name = 1;
  // type is one of the language's credential types: ssh, usernamePassword,
  // token, certificate, aws, azure, gcp, kubeconfig, registry.
  string type = 2;
  // ambient says the tool finds the credential for itself; no secret field
  // is given then.
  bool ambient = 3;
  // text holds the fields that are not secret, by name: a user, a region.
  map<string, string> text = 4;
  // flags holds the fields that are a yes or a no, by name: agent,
  // managedIdentity.
  map<string, bool> flags = 5;
  // secret_fields names the fields that hold secret material.
  repeated string secret_fields = 6;
}

// Capabilities is a target's honest declaration of what it can express. It is
// the mechanism behind the no-silent-capability-loss principle.
message Capabilities {
  bool native_notify = 1;
  bool synthetic_notify = 2;
  bool runtime_condition = 3;
  // secrets says the target takes a secret in a param: its emitter writes a
  // reference to the secret into the artifact, never the value, and its
  // runner hands the value to the tool by a private channel (the tool's
  // standard input, or a file only the user can read), never on the command
  // line and never in the environment. A host refuses a document that puts
  // a secret in a param of a target that does not say so, because the value
  // would otherwise be dropped or written into a file. A plugin built
  // before this field existed reports false, so the protocol version did
  // not change.
  bool secrets = 4;
  // credentials says the target takes the credential a document names for
  // its host: its emitter writes the credential's plain fields where its
  // tool reads them (a user into an inventory, say) and its runner hands the
  // secret fields to the tool by a private channel, as it hands secrets. A
  // host refuses a document that names a credential for a target that does
  // not say so. A plugin built before this field existed reports false.
  bool credentials = 5;
  // adopt says what the target does with a resource's adopt. A host refuses
  // a document that adopts anything for a target that says ADOPTION_NONE,
  // which is what a plugin built before this field existed reports.
  Adoption adopt = 6;
  // cloud_credentials says the target takes the credential a document names
  // for its cloud endpoint (spec.endpoint with type cloud: an aws, azure or
  // gcp credential): its runner hands the credential to the tool in the
  // tool's own environment, which is the only way the providers take one,
  // and a secret file where a provider reads one (a Google service account
  // key). A host refuses a document that names a cloud credential for a
  // target that does not say so. A plugin built before this field existed
  // reports false.
  bool cloud_credentials = 7;
}

// Adoption is how a target takes a thing that already exists under
// management.
enum Adoption {
  // It cannot.
  ADOPTION_NONE = 0;
  // The tool keeps its own record of what it manages, and the identifier is
  // compiled into the tool's own import (a Terraform import block, say).
  ADOPTION_IMPORT = 1;
  // The tool keeps no record and makes each thing what the document says
  // whether it existed or not: the identifier is accepted and not used.
  ADOPTION_CONVERGE = 2;
}

// Artifact is the complete output of a compile: relative path to file content.
// It is data rather than files on disk, which is what lets a plan be pure.
message Artifact {
  map<string, string> files = 1;
}

// Warning is a compile-time notice that does not fail the build but changes
// what an operator should expect from the artifact.
message Warning {
  string target = 1;
  string resource = 2;
  string msg = 3;
}

// CompileError is a target refusing to compile something.
//
// It travels as a field of a successful response rather than as a gRPC status
// error on purpose: a target rejecting a resource type it cannot express is the
// capability contract working as designed, not a fault. Status errors stay
// reserved for genuine transport and plugin failures, so a host can tell the
// two apart.
message CompileError {
  string resource = 1;
  // rule is the name of the refusal rule: one of the SDK's general rules, or
  // one the plugin declared in DescribeResponse.rules.
  string rule = 2;
  string msg = 3;
  Position pos = 4;
  // hint is what to write instead, as data; empty when the message is the
  // only guide. Added without a new protocol version: an older plugin sends
  // none, and the host shows what it has.
  string hint = 5;
}

// Rule is a refusal rule a plugin has of its own, beside the SDK's general
// ones: the name a CompileError carries, what it refuses, what to do instead.
message Rule {
  string name = 1;
  string meaning = 2;
  string hint = 3;
}

// Category is the kind of tool a plugin drives. The core routes on it, to
// decide which workflows a plugin can join and where in one it sits. It is a
// declared fact, never a reason for the core to special-case a product.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  // Provisions infrastructure: Terraform, Bicep, CloudFormation.
  CATEGORY_INFRASTRUCTURE_AS_CODE = 1;
  // Configures a node that already exists: Ansible, Puppet, Chef, DSC.
  CATEGORY_CONFIGURATION_MANAGEMENT = 2;
  // Builds and runs containers on one host: Docker.
  CATEGORY_CONTAINERIZATION = 3;
  // Schedules containers across a cluster: Kubernetes.
  CATEGORY_CONTAINER_ORCHESTRATION = 4;
}

// Operations is a plugin's type: what it can do for the core beyond compiling.
// Every plugin compiles. A plugin that sets any field here also serves Runner,
// and a host never calls a Runner method whose field is false.
message Operations {
  // plan: preview what applying an artifact would change, changing nothing.
  bool plan = 1;
  // apply: make the artifact's desired state real.
  bool apply = 2;
  // outputs: report named values the tool produced, for later stages to use.
  bool outputs = 3;
}

message DescribeRequest {}

message DescribeResponse {
  // protocol_version is the wire protocol the plugin speaks. A host refuses a
  // version it does not implement rather than guessing.
  uint32 protocol_version = 1;
  // sdk_version is the SDK the plugin was compiled against, reported rather
  // than inferred, per the release policy.
  string sdk_version = 2;
  string name = 3;
  // resource_types lists every IR resource type this target maps, sorted.
  repeated string resource_types = 4;
  Capabilities capabilities = 5;
  Category category = 6;
  Operations operations = 7;
  // target_versions lists the versions of its tool the plugin compiles for,
  // such as "3" or "1.9". A document's spec.targetVersion must be one of
  // them, or a more specific version under one of them ("3.1" under "3"). A
  // plugin that lists none does not say, and the host then refuses a document
  // that asks for a version rather than pretend to honour it. A plugin built
  // before this field existed reports none, so the protocol version did not
  // change.
  repeated string target_versions = 8;
  // import_formats lists the kinds of existing configuration the plugin can
  // turn into Meridian documents. A plugin that lists any also serves
  // Importer; a plugin that lists none is never asked to import.
  repeated ImportFormat import_formats = 9;
  // accepts_inputs says the plugin hands RunContext.inputs to its tool, as
  // the tool's own variables or parameters. A document that declares
  // spec.imports is refused for a plugin that does not say so, because the
  // values would otherwise be dropped without a word. A plugin built before
  // this field existed reports false, so the protocol version did not change.
  bool accepts_inputs = 10;
  // resource_schemas describes the target's resource types for editors: the
  // params and states each takes. It is advice, not a contract: Emit remains
  // the only judge of whether a document compiles. A plugin built before this
  // field existed reports none, and an editor then knows only the names in
  // resource_types, so the protocol version did not change.
  repeated ResourceSchema resource_schemas = 20;
  // placed_text lists the openings of the tool's own expression syntax, and
  // how each is written as literal text. The host applies them to every
  // value an interpolation places from data, so data can never open an
  // expression the tool evaluates (Jinja's "{{" for Ansible, a leading "["
  // for an ARM template). A plugin built before this field existed lists
  // none, and the host then escapes only Meridian's own "${", so the
  // protocol version did not change.
  repeated PlacedEscape placed_text = 21;
  // exports_schemas says the plugin serves SchemaSource: it can ask its
  // installed tool for the schemas of the tool's own resource types. A
  // plugin built before this field existed reports false, so the protocol
  // version did not change.
  bool exports_schemas = 22;
  // settings lists what an operator can configure about the plugin's runner:
  // each setting's name, the environment variable it is read from, its
  // default and what it does. The host lists them, generates documentation
  // from them, and refuses a project that names one the plugin does not
  // declare. A plugin built before this field existed lists none, so the
  // protocol version did not change.
  repeated Setting settings = 23;
  // settings_keys lists the keys the target reads in a document's
  // spec.settings: the tool's own settings for the whole document. A host
  // refuses a document whose settings name any other key, and a plugin
  // built before this field lists none, so such a document never reaches it
  // with settings silently dropped.
  repeated string settings_keys = 24;
  // rules is every refusal rule this plugin has of its own, beside the SDK's
  // general ones. A plugin built before this field lists none, which the
  // host reads as "only general rules".
  repeated Rule rules = 25;
  // saves_plans is true when the plugin's Runner hands back a SavedPlan from
  // Plan when asked (RunContext.save_plan) and applies exactly that plan when
  // handed one (RunContext.saved_plan). A plugin built before this field
  // saves none: an apply from a saved plan then checks the artifact's hash
  // and plans again, which the plan file says.
  bool saves_plans = 26;
  // reads_identifiers is true when the plugin's Runner answers Identifiers:
  // the tool's own identifier of each thing it manages, read from its state.
  // `meridian retarget` writes them as the resources' adopt for the new
  // target. A plugin built before this field reads none.
  bool reads_identifiers = 27;
  // debug_levels says what each debug level does to the tool, first level
  // first, as a person reads it: "TF_LOG=DEBUG", "-vvv". Empty when the
  // plugin has no debug output to give.
  repeated string debug_levels = 28;
  // destroys is true when the plugin's Runner answers Destroy, and previews
  // it when PlanRequest.destroy is set: it removes everything its tool
  // created for an artifact. A plugin built before this field destroys
  // nothing, and a stage of its target is left in place by `meridian
  // destroy`.
  bool destroys = 29;
  // inspects is true when the plugin's Runner answers Inspect: it reads one
  // resource as it is now, without changing anything. A plugin built before
  // this field inspects nothing, and `meridian inspect` refuses its stages
  // with the rule unsupported-inspect.
  bool inspects = 30;
}

// Setting is one thing an operator can configure about a runner.
message Setting {
  // name is the short name a project's meridian.yaml uses under
  // spec.settings.<target>: lower-case words joined by "-", such as "args".
  string name = 1;
  // variable is the environment variable the setting is read from, such as
  // "MERIDIAN_ANSIBLE_ARGS". The variable always wins over the project.
  string variable = 2;
  // default_value is what the setting is when nothing sets it; empty when
  // there is none.
  string default_value = 3;
  // description says what the setting does and what values it takes.
  string description = 4;
}

// PlacedEscape is one opening of a tool's expression syntax, and what the
// tool reads as that text and nothing more.
message PlacedEscape {
  // text opens an expression for the tool, such as "{{".
  string text = 1;
  // written is what the tool reads as the text itself, such as "{{ '{{' }}".
  string written = 2;
  // only_at_start says the text opens an expression only at the start of a
  // value, as "[" does in an ARM template.
  bool only_at_start = 3;
}

// ParamSchema is one param of a resource type.
message ParamSchema {
  string name = 1;
  string description = 2;
  // kind is the shape of the value: "string", "boolean", "integer", "number",
  // "list" or "mapping". Empty, or a name the host does not know, is any.
  string kind = 3;
  bool required = 4;
  // values lists what the param accepts when that is a fixed set.
  repeated string values = 5;
  // params describes what a param of kind "mapping" or "list" holds, when
  // that is known: the keys of the mapping, or of each item of the list.
  // Empty means any content.
  repeated ParamSchema params = 6;
  // open says a mapping accepts keys beyond the listed ones. Meaningless
  // for a param that lists none.
  bool open = 7;
  // computed says the tool sets the value: a document never writes it, but
  // a reference such as `${id.name}` may read it.
  bool computed = 8;
  // deprecated says the tool still takes the param but warns about it.
  bool deprecated = 9;
  // sensitive says the tool treats the value as a secret.
  bool sensitive = 10;
}

// ResourceSchema is one resource type as a target takes it.
message ResourceSchema {
  // type is the type as a document writes it. A name holding "<", such as
  // "<provider>_<type>", is a pattern.
  string type = 1;
  string description = 2;
  repeated string states = 3;
  string default_state = 4;
  repeated ParamSchema params = 5;
  // open says params beyond the listed ones are accepted.
  bool open = 6;
  // actions lists the notify actions the type can perform.
  repeated string actions = 7;
  // source says where the schema came from, when it was read from a tool:
  // "registry.terraform.io/hashicorp/aws 5.60.0", "kubernetes v1.31.0".
  // Empty for a schema the plugin itself declares.
  string source = 8;
}

message ExportSchemasRequest {
  // work_dir is a directory the host created for this target and keeps
  // between syncs. The plugin may initialise the tool there and keep what it
  // downloaded (providers, say) in it. The host never reads it.
  string work_dir = 1;
  // graphs are the documents that use this target, compiled to trees, so the
  // plugin can read from them which types, providers and versions the
  // project uses. Every compile-time `when` has already been decided.
  repeated ResourceGraph graphs = 2;
  // types lists the resource types the documents use, deduplicated and
  // sorted, for a plugin that does not need the whole trees.
  repeated string types = 3;
}

message ExportSchemasResponse {
  // schemas is one entry per resource type the tool described, with the
  // exact type name as a document writes it (never a pattern). A type the
  // tool could not describe is simply left out.
  repeated ResourceSchema schemas = 1;
  // tool and tool_version say what produced the schemas: "terraform",
  // "1.13.1".
  string tool = 2;
  string tool_version = 3;
  // pins are the exact versions of the parts the schemas were read from,
  // keyed by the tool's own name for each: a provider, a package, an API
  // server. The host records them so a cache can be told apart from one
  // read from other versions.
  map<string, string> pins = 4;
  // notes are things the plugin wants the operator to know: a type that
  // could not be described, a provider that was skipped.
  repeated string notes = 5;
  // error is set when the tool could not export anything. When it is set,
  // the other fields are meaningless.
  RunError error = 6;
}

// SchemaSource asks the installed tool for the schemas of its own resource
// types. It may run the tool and the network (to fetch providers, say), but
// it changes nothing outside work_dir.
service SchemaSource {
  rpc ExportSchemas(ExportSchemasRequest) returns (ExportSchemasResponse);
}

message EmitRequest {
  ResourceGraph graph = 1;
  // data_json is the resolved hierarchy data as a JSON object, carried for the
  // same reason params are: to preserve the value types the author wrote.
  bytes data_json = 2;
}

message EmitResponse {
  Artifact artifact = 1;
  repeated Warning warnings = 2;
  // error is set when the target could not compile the tree. When it is set,
  // artifact and warnings are meaningless.
  CompileError error = 3;
}

// Emitter compiles a target-agnostic resource tree into one target's native
// syntax. It has no side effects.
service Emitter {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Emit(EmitRequest) returns (EmitResponse);
}

// RunContext is what every Runner call needs to know about where it runs.
message RunContext {
  // document is the name of the document the artifact was compiled from.
  string document = 1;
  // host is the node the artifact configures; empty for a document that
  // provisions infrastructure instead of configuring a host.
  string host = 2;
  // work_dir is a directory the host created for this document and target and
  // keeps between runs. The plugin writes the artifact there and may keep the
  // tool's own state in it (a Terraform state file, say). The host never reads
  // or interprets what a plugin leaves in it.
  string work_dir = 3;
  // inputs_json is a JSON object of values handed to this stage from the
  // outputs of earlier ones, keyed by the name the document gave them.
  bytes inputs_json = 4;
  // secrets is the value of every secret the graph's params referred to,
  // sent only to a target whose capabilities include secrets, and only for
  // Plan, Apply, Destroy and Inspect: Outputs is sent none. The host sends them over the
  // plugin's private socket and nowhere else, and the SDK takes each one
  // into protected memory as it arrives and wipes the message. The plugin
  // holds them for the length of the call and no longer.
  repeated Secret secrets = 5;
  // credential is the identity the host is reached with, with the value of
  // each of its secret fields, sent as secrets are: only to a target whose
  // capabilities include credentials, and only for the calls that are sent
  // secrets.
  CredentialValues credential = 6;
  // save_plan asks Plan to hand back the tool's own saved plan in its result,
  // for `meridian plan --out`. A plugin that cannot, or whose saved plan would
  // carry a secret value, leaves PlanResult.saved unset; it is never an error.
  bool save_plan = 7;
  // saved_plan is the plan Apply must carry out exactly: what Plan saved for
  // this very artifact, in an earlier run. A plugin given one applies that
  // plan and nothing else, and fails when the tool finds it stale. The host
  // sends it only to a plugin whose Describe says saves_plans.
  SavedPlan saved_plan = 8;
  // debug_level asks the tool for more of its own output: 0 is none, the
  // default; 1, 2 and 3 ask for more each, as the plugin's Describe
  // debug_levels say. A plugin that declares fewer levels uses its highest
  // for a level above it, and one that declares none ignores it.
  uint32 debug_level = 9;
}

// SavedPlan is a tool's own saved plan, as the plugin chose to keep it: a
// Terraform plan file, a Pulumi plan, the name of a CloudFormation change set.
// The host never reads data; it keeps it in the plan file between the plan
// and the apply, so data must hold no secret value. changes is what the plan
// would do, as the plan reported it, so that an apply which the tool gives no
// second account of can still report what it did.
message SavedPlan {
  bytes data = 1;
  repeated Change changes = 2;
}

// CredentialValues is a credential with the value of each of its secret
// fields, as a run hands it to a plugin. The values cross the plugin's
// private socket in this message and are taken into protected memory by
// the SDK as they arrive, as a Secret's value is.
message CredentialValues {
  string name = 1;
  string type = 2;
  bool ambient = 3;
  map<string, string> text = 4;
  map<string, bool> flags = 5;
  repeated CredentialSecret secrets = 6;
}

// CredentialSecret is one secret field of a credential and its value.
message CredentialSecret {
  string field = 1;
  bytes value = 2;
}

// Secret is one secret's value, on its way to a plugin.
message Secret {
  uint32 slot = 1;
  string name = 2;
  bytes value = 3;
}

// ChangeAction is what the tool would do, or did, to one thing it manages.
enum ChangeAction {
  CHANGE_ACTION_UNSPECIFIED = 0;
  CHANGE_ACTION_CREATE = 1;
  CHANGE_ACTION_UPDATE = 2;
  CHANGE_ACTION_DELETE = 3;
  // Destroyed and created again, which is worth telling apart from an update
  // because it is the one that loses data.
  CHANGE_ACTION_REPLACE = 4;
  // Taken under management as it is, with nothing else changed: what a
  // resource's adopt does on its first plan.
  CHANGE_ACTION_ADOPT = 5;
}

// Change is one difference between desired and actual state.
message Change {
  // resource is the IR resource id when the tool's report can be traced back
  // to one, and otherwise the tool's own name for what changes.
  string resource = 1;
  ChangeAction action = 2;
  // summary is one line a person can read, in the tool's own terms.
  string summary = 3;
}

// Output is a named value the tool produced.
message Output {
  string name = 1;
  // value_json is the value as JSON, for the same reason params are: to keep
  // the type the tool reported.
  bytes value_json = 2;
  // sensitive marks a value that must be masked wherever it is shown or
  // logged. It must survive every hop to the stage that consumes it.
  bool sensitive = 3;
}

// RunError is the tool failing: a non-zero exit, a rejected configuration, an
// unreachable node.
//
// Like CompileError it travels inside a successful response. A failed apply is
// an answer about the infrastructure, not a fault in the plugin, and a host
// must be able to tell "Terraform said no" from "the plugin crashed".
message RunError {
  string msg = 1;
  // command is what the plugin ran, with any secret arguments removed.
  string command = 2;
  // exit_code is the tool's exit status; meaningful only when exited is true,
  // since a tool that could not be started at all has none.
  int32 exit_code = 3;
  bool exited = 4;
  // output is the end of what the tool printed, enough to explain the failure
  // without the whole log.
  string output = 5;
  // failures is each resource the tool failed on, as its structured report
  // says. A plugin that predates it sends none.
  repeated Failure failures = 6;
}

// Failure is one resource the tool failed on.
message Failure {
  // resource is the IR resource id when the tool's report traces back to
  // one, otherwise the tool's own name; empty for the document as a whole.
  string resource = 1;
  // endpoint is the machine it failed on, when the tool names one.
  string endpoint = 2;
  // cause is one fixed word: unreachable, auth-failed, invalid-config,
  // dependency-missing, resource-failed, dependency-failed, timed-out,
  // reboot-required, tool-crashed or unknown. A word the host does not know
  // reads as unknown.
  string cause = 3;
  // tool_code is the tool's own code or status, such as CREATE_FAILED.
  string tool_code = 4;
  // summary is one line; detail is the rest. Either can quote a value.
  string summary = 5;
  string detail = 6;
}

// LogLine is one line of the tool's own output, relayed while it runs.
message LogLine {
  enum Stream {
    STREAM_UNSPECIFIED = 0;
    STREAM_STDOUT = 1;
    STREAM_STDERR = 2;
  }
  Stream stream = 1;
  string text = 2;
}

message PlanRequest {
  RunContext context = 1;
  Artifact artifact = 2;
  // destroy asks for a preview of Destroy instead of Apply: every change is
  // a delete. The host sets it only for a plugin whose Describe says
  // destroys.
  bool destroy = 3;
}

// PlanResult is the preview. Either error is set, or changes is the complete
// list of what an apply would do; an empty list means nothing would change.
message PlanResult {
  repeated Change changes = 1;
  // unknown is true when the tool cannot preview: it says only that something
  // might change, or cannot say at all. A host must not read an empty changes
  // list as "in sync" when it is set.
  bool unknown = 2;
  RunError error = 3;
  // saved is the tool's own saved plan, when RunContext.save_plan asked for
  // one and the plugin could save it. Its changes are left empty: they are
  // the ones above.
  SavedPlan saved = 4;
}

message ApplyRequest {
  RunContext context = 1;
  Artifact artifact = 2;
}

// ApplyResult is what an apply did. When error is set, changes lists what was
// done before the failure, as far as the tool reported it.
message ApplyResult {
  repeated Change changes = 1;
  repeated Output outputs = 2;
  RunError error = 3;
}

// PlanEvent and ApplyEvent are what a run streams back: any number of log
// lines, then exactly one result as the last message. A stream that ends
// without a result is a plugin failure.
message PlanEvent {
  oneof event {
    LogLine log = 1;
    PlanResult result = 2;
  }
}

message ApplyEvent {
  oneof event {
    LogLine log = 1;
    ApplyResult result = 2;
  }
}

message DestroyRequest {
  RunContext context = 1;
  Artifact artifact = 2;
}

// DestroyResult is what a destroy removed. When error is set, changes lists
// what was removed before the failure, as far as the tool reported it.
message DestroyResult {
  repeated Change changes = 1;
  RunError error = 2;
}

message DestroyEvent {
  oneof event {
    LogLine log = 1;
    DestroyResult result = 2;
  }
}

message OutputsRequest {
  RunContext context = 1;
}

message OutputsResponse {
  repeated Output outputs = 1;
  RunError error = 2;
}

message IdentifiersRequest {
  RunContext context = 1;
}

message IdentifiersResponse {
  // identifiers maps a resource's id to the identifier the tool's import
  // takes for it. A resource the tool has no record of is left out.
  map<string, string> identifiers = 1;
  RunError error = 2;
}

message InspectRequest {
  RunContext context = 1;
  Artifact artifact = 2;
  // resource is the id of the resource to read, as the document declares it.
  string resource = 3;
  // endpoint is the machine to read it on: the context's host unless the
  // operator named another one the artifact configures.
  string endpoint = 4;
}

// InDesiredState is whether the tool says a resource is as declared.
enum InDesiredState {
  // The tool cannot say, or was not asked.
  IN_DESIRED_STATE_UNKNOWN = 0;
  IN_DESIRED_STATE_YES = 1;
  IN_DESIRED_STATE_NO = 2;
}

message InspectResponse {
  // found is false when the tool has no such resource: it was never made, or
  // was removed.
  bool found = 1;
  // actual_json is a JSON object of the resource's properties as the tool
  // reads them now, keyed by the document's param names where the plugin
  // can map them and by the tool's own names otherwise.
  bytes actual_json = 2;
  InDesiredState in_desired_state = 3;
  // command is the native command the plugin ran, as a person would type it,
  // with no secret in it.
  string command = 4;
  RunError error = 5;
}

// Runner hands an artifact to the real tool. Unlike Emitter it has side
// effects, takes as long as the tool takes, and can fail for reasons that have
// nothing to do with the document. Plan and Apply stream, so an operator sees
// the tool's output as it happens and not after a twenty-minute silence.
service Runner {
  // Plan previews what Apply would change. It changes nothing.
  rpc Plan(PlanRequest) returns (stream PlanEvent);
  // Apply makes the artifact's desired state real.
  rpc Apply(ApplyRequest) returns (stream ApplyEvent);
  // Outputs reports the values the last apply produced, read from the tool's
  // own state, without applying anything.
  rpc Outputs(OutputsRequest) returns (OutputsResponse);
  // Identifiers reports the tool's own identifier of each thing it manages,
  // by the id of the resource it was declared as, read from the tool's state
  // without changing anything. Asked only of a plugin whose Describe says
  // reads_identifiers.
  rpc Identifiers(IdentifiersRequest) returns (IdentifiersResponse);
  // Cancel asks the plugin to stop the Plan or Apply it is running: the SDK
  // stops the tool's process and the run's stream ends with a RunError that
  // carries what the tool had done so far. The stream is not closed by the
  // host, so the plugin's answer is heard. Added after protocol 2 was first
  // spoken; a host treats "unimplemented" as a plugin that cannot be asked.
  rpc Cancel(CancelRequest) returns (CancelResponse);
  // Destroy removes everything the tool created for the artifact, as the
  // tool's own destroy does. Asked only of a plugin whose Describe says
  // destroys; Cancel stops it as it stops Apply.
  rpc Destroy(DestroyRequest) returns (stream DestroyEvent);
  // Inspect reads one resource of the artifact as it is now, on one
  // endpoint, and changes nothing: no apply, no write to the tool's state.
  // Asked only of a plugin whose Describe says inspects.
  rpc Inspect(InspectRequest) returns (InspectResponse);
}

message CancelRequest {}

message CancelResponse {
  // Whether a Plan or Apply was running to be stopped.
  bool was_running = 1;
}

// ImportFormat is one kind of existing configuration a plugin can read, such
// as Terraform's HCL or a Compose file.
message ImportFormat {
  // name is a short word for the format, such as "hcl" or "compose".
  string name = 1;
  // description is one line a person can read in a listing.
  string description = 2;
  // patterns are the file names the format usually has, as globs over the
  // file's base name: "*.tf", "compose.yaml". The host uses them to gather a
  // directory's files and to guess which plugin a file belongs to. They are a
  // hint, never a guarantee: the plugin still decides what it can read.
  repeated string patterns = 3;
}

message ImportRequest {
  // files is the configuration to read: path, relative to what the operator
  // named, to the file's text.
  map<string, string> files = 1;
  // name is what the operator wants the imported document called. When the
  // source yields several documents the plugin derives each one's name from
  // it. Empty lets the plugin choose.
  string name = 2;
  // root is the directory the files were read from, as an absolute path on
  // the operator's machine; empty when they did not come from one place. The
  // plugin never reads it. It is there for a configuration whose meaning
  // depends on where it is, such as one that names files beside itself.
  string root = 3;
}

// ImportedResource is one resource of an imported document, in the terms a
// Meridian document is written in.
message ImportedResource {
  string id = 1;
  string type = 2;
  string state = 3;
  // params_json is the resource's params as a JSON object, for the same
  // reason Resource.params_json is JSON: to keep the value types.
  bytes params_json = 4;
  // depends_on lists the ids of the resources this one must follow.
  repeated string depends_on = 5;
  repeated ImportedNotify notifies = 6;
  string runtime_when = 7;
  // origin says where in the source the resource came from, such as
  // "main.tf:12". It is written beside the resource as a comment.
  string origin = 8;
}

message ImportedNotify {
  string resource = 1;
  string action = 2;
}

message ImportedOutput {
  string name = 1;
  string value = 2;
}

// DocumentKind is which of Meridian's document kinds an imported document is.
enum DocumentKind {
  DOCUMENT_KIND_UNSPECIFIED = 0;
  // Provisions things: an Infrastructure document.
  DOCUMENT_KIND_INFRASTRUCTURE = 1;
  // Configures a host that exists: a ResourceSet document.
  DOCUMENT_KIND_RESOURCE_SET = 2;
}

// ImportedDocument is one Meridian document, as data. The host writes it out
// in the language's current syntax, so a plugin never has to know how a
// document is spelled.
message ImportedDocument {
  DocumentKind kind = 1;
  string name = 2;
  // target is the target the document selects; empty means the plugin that
  // imported it.
  string target = 3;
  string target_version = 4;
  // host is the node a ResourceSet configures; empty when the source does not
  // name one.
  string host = 5;
  repeated ImportedResource resources = 6;
  repeated ImportedOutput outputs = 7;
  // settings_json is the document's spec.settings as a JSON object, by the
  // keys the target takes; empty when the source expressed none.
  bytes settings_json = 8;
}

// NoteLevel says how much an importer's note should worry the operator.
enum NoteLevel {
  NOTE_LEVEL_UNSPECIFIED = 0;
  // Carried over faithfully; the note explains how.
  NOTE_LEVEL_INFO = 1;
  // Carried over, but not as the source wrote it. The document may behave
  // differently and should be reviewed.
  NOTE_LEVEL_CHANGED = 2;
  // Not carried over at all. The document does less than the source did until
  // someone writes the missing part.
  NOTE_LEVEL_UNTRANSLATED = 3;
}

// ImportNote is one thing the importer wants the operator to know. Nothing
// the source says may be dropped without one: a note of level CHANGED or
// UNTRANSLATED becomes a TODO marker in the written document.
message ImportNote {
  NoteLevel level = 1;
  // origin says where in the source the note is about, such as "main.tf:12".
  string origin = 2;
  // subject names the thing, in the source's own terms: `variable "region"`,
  // `task "Install nginx"`.
  string subject = 3;
  string msg = 4;
  // document is the name of the imported document the note belongs to; empty
  // when it is about the import as a whole.
  string document = 5;
  // resource is the id of the imported resource the note belongs to; empty
  // when it is about the document.
  string resource = 6;
}

// ImportError is the importer being unable to read the source at all: a
// syntax error, or a file that is not this tool's. Like CompileError it
// travels inside a successful response, because it is an answer about the
// source and not a fault in the plugin.
message ImportError {
  string msg = 1;
  string file = 2;
  // line is 1-based; zero when unknown.
  int32 line = 3;
}

message ImportResponse {
  repeated ImportedDocument documents = 1;
  repeated ImportNote notes = 2;
  // error is set when nothing could be imported. When it is set, documents
  // and notes are meaningless.
  ImportError error = 3;
}

// Importer turns a tool's existing configuration into Meridian documents. It
// has no side effects: it reads the text it is given and nothing else.
service Importer {
  rpc Import(ImportRequest) returns (ImportResponse);
}
