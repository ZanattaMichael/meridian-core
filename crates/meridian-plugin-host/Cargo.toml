[package]
name = "meridian-plugin-host"
description = "The host side of Meridian's plugin protocol: launching a target plugin and driving it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meridian-ast = { path = "../meridian-ast" }
meridian-sdk = { path = "../meridian-sdk" }
meridian-signing = { path = "../meridian-signing" }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tonic = { workspace = true }

# A plugin listens on a named pipe on Windows, which the transport cannot dial
# by itself.
[target.'cfg(windows)'.dependencies]
hyper-util = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true }

[dev-dependencies]
meridian-ir = { path = "../meridian-ir" }
meridian-plugin-testkit = { path = "../meridian-plugin-testkit" }
meridian-target-fake = { path = "../meridian-target-fake" }

[lints]
workspace = true
