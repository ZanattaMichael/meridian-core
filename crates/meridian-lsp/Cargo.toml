[package]
name = "meridian-lsp"
description = "The Meridian language server: completion, hover, diagnostics from the real compiler, definitions and formatting, over the Language Server Protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
meridian-plugin-host = { path = "../meridian-plugin-host" }
meridian-tooling = { path = "../meridian-tooling" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
meridian-target-ansible = { path = "../../plugins/ansible" }
meridian-target-terraform = { path = "../../plugins/terraform" }

[lints]
workspace = true
