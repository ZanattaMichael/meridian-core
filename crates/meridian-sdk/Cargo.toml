[package]
name = "meridian-sdk"
description = "The public contract a Meridian target plugin implements, and the wire protocol it speaks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
meridian-secret = { path = "../meridian-secret" }
meridian-value = { path = "../meridian-value" }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "signal", "macros"] }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[lints]
workspace = true
