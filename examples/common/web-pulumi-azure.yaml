# The web server of web-aws.yaml on Azure, as a Pulumi YAML program: the
# same common resources, mapped to the azure-native package's types.
#
# Azure puts every resource in a resource group and a location, which
# spec.settings gives once for the whole document. An Azure subnet gives no
# machine a public address, so the machine takes the address resource.
apiVersion: meridian/v1
kind: Infrastructure
metadata:
  name: web-pulumi-azure
spec:
  target: pulumi
  settings:
    cloud: azure
    location: westeurope
    resourceGroup: web-prod
  resources:
    - id: location
      type: config
      params:
        name: azure-native:location
        value: westeurope

    - id: net
      type: network
      params:
        cidr: 10.0.0.0/16

    - id: web
      type: subnet
      params:
        network: ${net}
        cidr: 10.0.1.0/24

    - id: web_fw
      type: firewall
      params:
        network: ${net}
        rules:
          - {port: "22", cidr: 203.0.113.0/24}
          - {port: "80", cidr: 0.0.0.0/0}
          - {port: "443", cidr: 0.0.0.0/0}

    - id: web_ip
      type: address

    - id: vm
      type: vm
      params:
        subnet: ${web}
        firewalls: ["${web_fw}"]
        address: ${web_ip}
        size: {cpus: 2, memoryGb: 4}
        image: {family: ubuntu, version: "24.04"}
        sshKey: ssh-rsa  admin@example.com

    # A data disk, attached to the machine.
    - id: store
      type: disk
      params:
        vm: ${vm}
        sizeGb: 50

    # A store of files, keeping older versions.
    - id: files
      type: objectStore
      params:
        versioning: true

  outputs:
    - name: address
      value: ${vm.publicAddress}
    - name: private_address
      value: ${vm.privateAddress}
