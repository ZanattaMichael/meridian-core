# The web server of web-aws.yaml on Azure: the same common resources,
# compiled by Terraform with the azurerm provider.
#
# Azure puts every resource in a resource group and a location, which
# spec.settings gives once for the whole document. An Azure subnet gives no
# machine a public address, so the machine takes the address resource.
apiVersion: meridian/v1
kind: Infrastructure
metadata:
  name: web-azure
spec:
  target: terraform
  settings:
    cloud: azure
    location: westeurope
    resourceGroup: web-prod
  resources:
    - id: azurerm
      type: provider
      params:
        source: hashicorp/azurerm
        version: "~> 4.0"
        features: {}

    - id: net
      type: network
      params:
        cidr: 10.0.0.0/16

    - id: web
      type: subnet
      params:
        network: ${net}
        cidr: 10.0.1.0/24

    - id: web_fw
      type: firewall
      params:
        network: ${net}
        rules:
          - {port: "22", cidr: 203.0.113.0/24}
          - {port: "80", cidr: 0.0.0.0/0}
          - {port: "443", cidr: 0.0.0.0/0}

    - id: web_ip
      type: address

    - id: vm
      type: vm
      params:
        subnet: ${web}
        firewalls: ["${web_fw}"]
        address: ${web_ip}
        size: {cpus: 2, memoryGb: 4}
        image: {family: ubuntu, version: "24.04"}
        sshKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyOnly admin@example.com

  outputs:
    - name: address
      value: ${vm.publicAddress}
    - name: private_address
      value: ${vm.privateAddress}
