# The web server of web-aws.yaml on Google Cloud: the same common resources,
# compiled by Terraform with the google provider.
#
# spec.settings.location is the region; the vm goes to its zone b unless it
# gives a location of its own. As on Azure, the machine takes the address
# resource, and the firewall's rules apply to the machines that list it.
apiVersion: meridian/v1
kind: Infrastructure
metadata:
  name: web-gcp
spec:
  target: terraform
  settings:
    cloud: gcp
    location: europe-west1
  resources:
    - id: google
      type: provider
      params:
        source: hashicorp/google
        version: "~> 6.0"
        project: example-project
        region: europe-west1

    - id: net
      type: network
      params:
        cidr: 10.0.0.0/16

    - id: web
      type: subnet
      params:
        network: ${net}
        cidr: 10.0.1.0/24

    - id: web_fw
      type: firewall
      params:
        network: ${net}
        rules:
          - {port: "22", cidr: 203.0.113.0/24}
          - {port: "80", cidr: 0.0.0.0/0}
          - {port: "443", cidr: 0.0.0.0/0}

    - id: web_ip
      type: address

    - id: vm
      type: vm
      params:
        subnet: ${web}
        firewalls: ["${web_fw}"]
        address: ${web_ip}
        size: {cpus: 2, memoryGb: 4}
        image: {family: ubuntu, version: "24.04"}
        sshKey: ssh-rsa  admin@example.com

    # A data disk, attached to the machine.
    - id: store
      type: disk
      params:
        vm: ${vm}
        sizeGb: 50

  outputs:
    - name: address
      value: ${vm.publicAddress}
    - name: private_address
      value: ${vm.privateAddress}
