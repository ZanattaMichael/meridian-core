# A credential for a host: Ansible reaches the machine as the deploy user,
# with a private key that is a secret.
#
# spec.credentials declares the identity once, by name and type. Its user is
# plain text and goes where the tool reads it; its key is a secret, read from
# a file only the operator can read, and never written into the document.
# targetHost.credential names the identity the host is reached as.
#
#   meridian compile credential-for-a-host.yaml
#
#     [meridian]
#     web01.internal ansible_user=deploy
#
# plan and apply fetch the key, write it into a file only the user can read,
# and pass ansible-playbook its path as --private-key. The key is in no file
# Meridian keeps, never on the command line and never in the tool's
# environment. The file is removed when the run ends, and the plan says who
# the host is reached as, by name:
#
#   meridian plan credential-for-a-host.yaml
#
#     web (ansible) on web01.internal as deploy (ssh, user deploy)
apiVersion: meridian/v1
kind: ResourceSet
metadata:
  name: web
spec:
  target: ansible
  secrets:
    - name: deploy_key
      from: file
      path: /run/secrets/deploy_key
      # A PEM key ends in a line break, and OpenSSH wants it kept.
      keepTrailingNewline: true
  credentials:
    - name: deploy
      type: ssh
      user: deploy
      privateKey: ${{ secret.deploy_key }}
  targetHost:
    from: inline
    host: web01.internal
    credential: deploy

  resources:
    - id: nginx_pkg
      type: package
      params:
        name: nginx

    - id: nginx_svc
      type: service
      state: running
      params:
        name: nginx
      dependsOn:
        - resource: nginx_pkg
