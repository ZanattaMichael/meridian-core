# One document for a laptop, a pipeline and a service, each keeping the
# deploy token where it is best kept there.
#
# A secret names the places it may be in, in order. The first place that has
# it answers. A place this machine does not have at all (the desktop's
# Secret Service on a server, the unit's credentials on a laptop) is passed
# over for the next, so nobody edits the document to run it somewhere else:
#
#   on a laptop      the desktop's own store (GNOME Keyring, KWallet), or the
#                    kernel keyring, which never touches a disk
#   as a service     the credential systemd gave the unit, with
#                    LoadCredentialEncrypted=deploy-token:...
#   in a pipeline    the variable the pipeline's own secret store sets
#
# The value is put in the first store Meridian can write, typed at a prompt
# that does not show it or piped in, and never given as an argument:
#
#   meridian secret set deploy_token secret-from-a-store.yaml
#
# and which place would answer is asked without reading it:
#
#   meridian secret check secret-from-a-store.yaml
#
# The secret is read by a condition, which lets out a yes or a no and nothing
# else, so this document can be planned and applied today.
apiVersion: meridian/v1
kind: ResourceSet
metadata:
  name: deploys
spec:
  target: ansible

  conditions:
    can_deploy: secret.deploy_token != null

  secrets:
    - name: deploy_token
      # Asked first. Without a session bus it is not there to ask, and the
      # next place is tried.
      from: secret-service
      attributes:
        app: meridian
        name: deploy-token
      # No place having it is a machine that does not deploy, not an error.
      # A place that is there and refuses (a file others can read, a command
      # that fails) still stops the run.
      optional: true
      fallback:
        # A key of the user's or the session's keyring, in the kernel.
        - from: keyring
          key: meridian:deploy-token
        # What systemd passed to the unit Meridian runs as.
        - from: systemd-creds
          key: deploy-token
        # Last, and weakest: a variable, removed from Meridian's environment
        # as soon as it is read so that no tool inherits it.
        - from: env
          key: DEPLOY_TOKEN
  targetHost:
    from: inline
    host: build01.example.com

  resources:
    - id: conf_dir
      type: file
      state: directory
      params:
        path: /etc/deploys
        mode: "0755"

    - id: deploys_conf
      type: file
      params:
        path: /etc/deploys/deploys.conf
        mode: "0644"
        # The answer to a condition is not a secret, so it can be written.
        content: |
          deploys = ${{ cond.can_deploy ? 'enabled' : 'disabled' }}
      dependsOn:
        - resource: conf_dir

    # Only on a machine that has the token.
    - id: deploy_timer
      type: file
      when: cond.can_deploy
      params:
        path: /etc/deploys/timer.conf
        mode: "0644"
        content: "every = 15m\n"
      dependsOn:
        - resource: conf_dir
