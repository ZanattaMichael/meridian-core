# What a machine is given depends on which secrets it has, without any secret
# being written anywhere.
#
# Three secrets, one from each provider. None is placed in a file: each one
# is read by a condition, and a condition lets out a yes or a no and nothing
# else. So this document can be planned and applied today, and the plan shows
# every condition in the words written here, never the value behind it.
#
#   SITE_DB_PASSWORD=... meridian plan features-by-secret.yaml \
#       --data features-by-secret.data.yaml
#
# validate checks all of it without reading a secret. compile stops, because
# these conditions cannot be decided without fetching one, and compile never
# fetches:
#
#   (secret db_password) is not fetched here: a secret is fetched by plan and
#   apply, never by validate or compile
apiVersion: meridian/v1
kind: ResourceSet
metadata:
  name: site
  labels:
    env: ${{ data.env }}
spec:
  target: ansible
  targetHost:
    from: inline
    host: ${{ data.host }}

  secrets:
    # Required. The run stops if the variable is not set. The variable is
    # removed from Meridian's environment as soon as it is read, so the tool
    # does not inherit it.
    - name: db_password
      from: env
      key: SITE_DB_PASSWORD

    # Optional. A machine without the file has no licence, and secret.license
    # is null there. The file must be readable by its owner alone.
    - name: license
      from: file
      path: /etc/site/license.key
      optional: true

    # Whatever the command prints, without a shell: three words, handed to
    # `pass` as they are. Optional here means a command that prints nothing
    # is a machine with no token. A command that fails still stops the run.
    - name: deploy_token
      from: exec
      command: [pass, show, site/deploy-token]
      optional: true

  variables:
    root: /etc/${{ data.name }}

  # Each condition is decided once, when the stage starts and the secrets
  # have been fetched. What it holds afterwards is true or false.
  conditions:
    licensed: secret.license != null
    # Compared without the value being copied anywhere, in the same time
    # wherever the two differ.
    default_password: secret.db_password == 'changeme' || secret.db_password == ''
    can_deploy: secret.deploy_token != null && !cond.default_password
    # A secret beside ordinary data.
    hardened: data.env == 'prod' && !cond.default_password

  resources:
    - id: conf_dir
      type: file
      state: directory
      params:
        path: ${{ var.root }}
        mode: "0755"

    - id: site_conf
      type: file
      params:
        path: ${{ var.root }}/site.conf
        mode: "0644"
        # The answer to a condition is not a secret, so it can be written.
        content: |
          name = ${{ data.name }}
          licensed = ${{ cond.licensed }}
          deploys = ${{ cond.can_deploy ? 'enabled' : 'disabled' }}
      dependsOn:
        - resource: conf_dir

    # Only where there is a licence.
    - id: premium_conf
      type: file
      when: cond.licensed
      params:
        path: ${{ var.root }}/premium.conf
        mode: "0644"
        content: "reports = on\n"
      dependsOn:
        - resource: conf_dir

    # A machine still on the default password says so at every login.
    - id: password_warning
      type: file
      when: cond.default_password
      params:
        path: /etc/motd
        mode: "0644"
        content: "This machine still has the default database password.\n"

    - id: deploy_conf
      type: file
      when: cond.can_deploy
      params:
        path: ${{ var.root }}/deploy.conf
        mode: "0600"
        content: "deploys = enabled\n"
      dependsOn:
        - resource: conf_dir
        # The order only matters where the premium settings exist.
        - resource: premium_conf
          when: cond.licensed

    - id: hardening
      type: file
      when: cond.hardened
      params:
        path: ${{ var.root }}/hardening.conf
        mode: "0644"
        content: "strict = on\n"
      dependsOn:
        - resource: conf_dir
