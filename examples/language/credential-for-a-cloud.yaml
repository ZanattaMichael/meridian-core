# A credential for a cloud: Terraform reaches AWS as an access key whose
# secret half is a secret.
#
# spec.credentials declares the identity once, by name and type. The access
# key id and the region are plain text; the secret access key is a secret,
# read from a file only the operator can read, and never written into the
# document. spec.endpoint names the cloud the document is applied to and the
# identity it is reached as.
#
#   meridian compile credential-for-a-cloud.yaml
#
# The configuration holds nothing of the credential: the providers read a
# login from their environment, and that is where plan and apply put it,
# for the length of the stage and for Terraform's own processes only. The
# plan line says so, because the environment is the last channel the plan
# allows, taken here because the providers take a login no other way:
#
#   meridian plan credential-for-a-cloud.yaml
#
#     logs (Infrastructure, target terraform as prod (aws, region eu-west-1), in the tool's environment)
apiVersion: meridian/v1
kind: Infrastructure
metadata:
  name: logs
spec:
  target: terraform
  secrets:
    - name: aws_secret_key
      from: file
      path: /run/secrets/aws_secret_key
  credentials:
    - name: prod
      type: aws
      accessKeyId: AKIAIOSFODNN7EXAMPLE
      secretAccessKey: ${{ secret.aws_secret_key }}
      region: eu-west-1
  endpoint:
    type: cloud
    credential: prod

  resources:
    - id: logs
      type: aws_s3_bucket
      params:
        bucket: shop-logs
