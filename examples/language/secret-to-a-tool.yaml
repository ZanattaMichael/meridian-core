# A secret handed to a tool: a database password that Ansible writes into a
# file on the host.
#
# The target takes secrets, so the password may be placed in a resource's
# params. It never reaches the tool through the compiled files. The playbook
# refers to it by name, and the task that holds it is marked no_log so Ansible
# prints neither its arguments nor its diff:
#
#   meridian compile secret-to-a-tool.yaml
#
#     - name: db_conf
#       ansible.builtin.copy:
#         content: '{{ meridian_secret_db_password }}'
#         dest: /etc/app/db.conf
#         mode: "0600"
#       no_log: true
#
# plan and apply fetch the password, write it into an extra-vars file only the
# user can read, and pass ansible-playbook that file's path. The value is in
# no file Meridian keeps, never on the command line and never in the tool's
# environment. The file is removed when the run ends.
#
#   APP_DB_PASSWORD=... meridian plan secret-to-a-tool.yaml
apiVersion: meridian/v1
kind: ResourceSet
metadata:
  name: db-settings
spec:
  target: ansible

  secrets:
    - name: db_password
      from: env
      key: APP_DB_PASSWORD
  targetHost:
    from: inline
    host: db01.internal

  resources:
    - id: app_dir
      type: file
      state: directory
      params:
        path: /etc/app
        mode: "0755"

    # The whole value is the secret, so it is handed over under its own name.
    - id: db_conf
      type: file
      params:
        path: /etc/app/db.conf
        # Only the application's own user may read it.
        mode: "0600"
        content: ${{ secret.db_password }}
      dependsOn:
        - resource: app_dir

    # A value made from a secret and text is a secret of its own, named
    # derived_1, and the tool receives the whole line under that name.
    - id: db_url
      type: file
      params:
        path: /etc/app/db.url
        mode: "0600"
        content: "postgres://app:${{ urlEncode(secret.db_password) }}@db.internal:5432/app\n"
      dependsOn:
        - resource: app_dir
