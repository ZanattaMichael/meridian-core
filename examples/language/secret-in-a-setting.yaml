# A secret placed in a setting: a database URL with the password inside it.
#
# The password is joined to ordinary text, and the whole of what it touches
# becomes a secret: the URL, and the file it is in. urlEncode is one of the
# few functions that takes a secret, because it can do its work without the
# value leaving protected memory.
#
#   meridian compile secret-in-a-setting.yaml --data secret-in-a-setting.data.yaml
#
# compile never reads a secret. Where one belongs it writes its name, so the
# compiled files can be read and reviewed, and are not something a tool can
# run:
#
#   DATABASE_URL=postgres://app:urlEncode((secret db_password))@db.internal:5432/app
#
# plan and apply stop at this document for now, and say why: handing a secret
# to a tool needs a way in that is not the compiled files, and each target
# gains its own in a later release. Until then, a secret can decide a
# condition (features-by-secret.yaml), and nothing writes one to disk to get
# past this.
apiVersion: meridian/v1
kind: ResourceSet
metadata:
  name: app-settings
spec:
  target: chef
  targetHost:
    from: inline
    host: ${{ data.host }}

  secrets:
    - name: db_password
      from: env
      key: APP_DB_PASSWORD
    # Without one, the application signs nothing, and the line is left out.
    - name: signing_key
      from: file
      path: /etc/app/signing.key
      optional: true

  variables:
    # A variable made from a secret is a secret.
    database_url: postgres://app:${{ urlEncode(secret.db_password) }}@${{ data.db.host }}:${{ data.db.port }}/app

  resources:
    - id: app_env
      type: file
      params:
        path: /etc/app/env
        # Only the application's own user may read it.
        mode: "0600"
        owner: app
        content: |
          DATABASE_URL=${{ var.database_url }}
          SIGNING_KEY=${{ base64Encode(secret.signing_key ?? '') }}
          LOG_LEVEL=${{ data.log_level }}

    # No secret here, so this file is compiled as usual.
    - id: app_conf
      type: file
      params:
        path: /etc/app/app.conf
        mode: "0644"
        content: |
          listen = ${{ data.listen }}
      dependsOn:
        - resource: app_env
