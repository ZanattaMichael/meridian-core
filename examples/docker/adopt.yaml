# Taking over a container Docker already runs.
#
# Docker keeps no record of what it manages and Compose will not adopt a
# container it did not create, so this document cannot import one by an
# identifier. `adopt: replace` is the one way it can take one over: the
# existing container of that service's name is stopped and removed, then made
# again from the document. Read the plan before the first apply.
apiVersion: meridian/v1
kind: Infrastructure
metadata:
  name: adopt
spec:
  target: docker
  resources:
    - id: project
      type: project
      params:
        name: adopt

    - id: web
      type: service
      adopt: replace
      params:
        image: nginx:1.27
        ports:
          - "8080:80"
