# What `cargo deny check` holds the dependency tree to. CI runs it in the
# `dependencies` job of rust.yml.

[graph]
all-features = true

[advisories]
# A known vulnerability in a dependency fails the build. An advisory that
# cannot be acted on yet is listed under `ignore` with its id and a reason.
version = 2
ignore = []

[licenses]
version = 2
# Meridian is MIT; these are the licences its dependencies may carry.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    # webpki-roots, the certificate bundle ureq verifies registries with.
    "CDLA-Permissive-2.0",
]

[bans]
# Two versions of one crate that the workspace itself names is a bump made in
# one place and not another, which [workspace.dependencies] exists to
# prevent. Dependencies also bring in their own duplicates (two `syn`, two
# `bitflags`) that are not ours to fix, so this warns rather than fails;
# `cargo tree --workspace --duplicates` lists them.
multiple-versions = "warn"
# The workspace's own crates depend on each other by path with no version,
# which this check would call a wildcard; it is not checked until the
# crates are published with versions.
wildcards = "allow"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
