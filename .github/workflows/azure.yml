name: azure

# The Bicep and ARM plugins against real tooling.
#
# The first job needs no Azure account: the real Bicep compiler builds every
# Bicep file the Bicep plugin compiles, and reads every template the ARM
# plugin compiles. It proves that what Meridian writes is valid; it cannot
# prove what Azure does with it.
#
# The second job does that: what-if, a deployment and its outputs in a real
# resource group. It only runs once the repository has been given a
# subscription to use; until then it is skipped, and the workflow says so.
# docs/contributing/real-tool-tests.md lists the settings it needs.

on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/meridian-ast/**'
      - 'crates/meridian-expr/**'
      - 'crates/meridian-graph/**'
      - 'crates/meridian-import/**'
      - 'crates/meridian-ir/**'
      - 'crates/meridian-plugin-host/**'
      - 'crates/meridian-plugin-testkit/**'
      - 'crates/meridian-sdk/**'
      - 'crates/meridian-secret/**'
      - 'crates/meridian-signing/**'
      - 'crates/meridian-target-fake/**'
      - 'crates/meridian-value/**'
      - 'crates/meridian-yaml/**'
      - 'plugins/arm/**'
      - 'plugins/bicep/**'
      - 'examples/bicep/**'
      - 'examples/common/**'
      - 'examples/arm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/azure.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read

# A newer push to the same pull request cancels this run. Runs on main are
# never cancelled: the subscription job deploys real resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BICEP_VERSION: v0.36.1

jobs:
  offline:
    if: github.event.pull_request.draft != true
    name: real bicep compiler, no account
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - name: Install the Bicep compiler
        run: |
          az bicep install --version "$BICEP_VERSION"
          az version
          az bicep version

      # With the variables set, a compiler that does not run fails the tests,
      # so this job cannot pass by checking nothing.
      - name: Build what the Bicep plugin compiles
        env:
          MERIDIAN_TEST_REAL_BICEP: '1'
        run: cargo test -p meridian-target-bicep --locked --test real -- --ignored --nocapture

      - name: Read what the ARM plugin compiles
        env:
          MERIDIAN_TEST_REAL_ARM: '1'
        run: cargo test -p meridian-target-arm --locked --test real -- --ignored --nocapture

  subscription:
    if: github.event.pull_request.draft != true
    name: what-if and deploy in a real subscription
    # Runs only when the repository names a resource group to use, and never
    # for a pull request from a fork, which cannot sign in.
    if: >-
      vars.AZURE_RESOURCE_GROUP != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      # Signs in with a short-lived token GitHub issues for this run. No
      # password or client secret is stored anywhere.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Bicep compiler
        run: az bicep install --version "$BICEP_VERSION"

      - name: Deploy with the Bicep plugin
        env:
          MERIDIAN_TEST_REAL_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: cargo test -p meridian-target-bicep --locked --test real a_deployment -- --ignored --nocapture

      - name: Deploy with the ARM plugin
        env:
          MERIDIAN_TEST_REAL_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: cargo test -p meridian-target-arm --locked --test real a_deployment -- --ignored --nocapture
