name: terraform

# The Terraform plugin against a real terraform, and against OpenTofu's tofu,
# which the plugin also drives. The rust workflow already runs the plugin's
# other tests; without MERIDIAN_TEST_REAL_TERRAFORM these ones pass without
# doing anything, so they are run here, where the tool is installed.

on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/meridian-ast/**'
      - 'crates/meridian-expr/**'
      - 'crates/meridian-graph/**'
      - 'crates/meridian-import/**'
      - 'crates/meridian-ir/**'
      - 'crates/meridian-plugin-host/**'
      - 'crates/meridian-plugin-testkit/**'
      - 'crates/meridian-sdk/**'
      - 'crates/meridian-secret/**'
      - 'crates/meridian-signing/**'
      - 'crates/meridian-target-fake/**'
      - 'crates/meridian-value/**'
      - 'crates/meridian-yaml/**'
      - 'plugins/terraform/**'
      - 'examples/terraform/**'
      - 'examples/common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/terraform.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read

# A newer run for the same branch or pull request cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    if: github.event.pull_request.draft != true
    name: plan and apply with terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      # The wrapper script the action can install rewrites terraform's output,
      # which would break reading its JSON.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.x
          terraform_wrapper: false

      - name: Show the version under test
        run: terraform version

      # With the variable set, a terraform that does not run fails the tests,
      # so this job cannot pass by checking nothing.
      - name: Test against terraform
        env:
          MERIDIAN_TEST_REAL_TERRAFORM: '1'
          MERIDIAN_TEST_REAL_TERRAFORM_NETWORK: '1'
        run: cargo test -p meridian-target-terraform --locked --test real -- --ignored --nocapture

  tofu:
    if: github.event.pull_request.draft != true
    name: the same tests with tofu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false

      - name: Show the version under test
        run: tofu version

      - name: Test against tofu
        env:
          MERIDIAN_TEST_REAL_TERRAFORM: '1'
          MERIDIAN_TEST_REAL_TERRAFORM_NETWORK: '1'
          MERIDIAN_TERRAFORM: tofu
        run: cargo test -p meridian-target-terraform --locked --test real -- --ignored --nocapture
