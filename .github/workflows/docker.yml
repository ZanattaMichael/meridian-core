name: docker

# The Docker plugin against the real Docker daemon and Compose. The rust
# workflow runs the same test, but there a runner without Docker would skip
# it; here MERIDIAN_TEST_REAL_DOCKER=1 makes a missing Docker a failure, so this
# job cannot pass by checking nothing.

on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/meridian-ast/**'
      - 'crates/meridian-expr/**'
      - 'crates/meridian-graph/**'
      - 'crates/meridian-import/**'
      - 'crates/meridian-ir/**'
      - 'crates/meridian-plugin-host/**'
      - 'crates/meridian-plugin-testkit/**'
      - 'crates/meridian-sdk/**'
      - 'crates/meridian-secret/**'
      - 'crates/meridian-signing/**'
      - 'crates/meridian-target-fake/**'
      - 'crates/meridian-value/**'
      - 'crates/meridian-yaml/**'
      - 'plugins/docker/**'
      - 'examples/docker/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read

# A newer run for the same branch or pull request cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real:
    if: github.event.pull_request.draft != true
    name: real docker daemon and compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - name: Show the versions under test
        run: |
          docker version
          docker compose version

      - name: Bring a project up, change it and take it down
        env:
          MERIDIAN_TEST_REAL_DOCKER: '1'
        run: cargo test -p meridian-target-docker --locked --test real -- --ignored --nocapture --test-threads=1
