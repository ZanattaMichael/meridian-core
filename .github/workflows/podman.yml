name: podman

# The Podman plugin against the real Podman and systemd. The rust workflow
# already runs the plugin's own tests against stand-ins.

on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/meridian-ast/**'
      - 'crates/meridian-expr/**'
      - 'crates/meridian-graph/**'
      - 'crates/meridian-import/**'
      - 'crates/meridian-ir/**'
      - 'crates/meridian-plugin-host/**'
      - 'crates/meridian-plugin-testkit/**'
      - 'crates/meridian-sdk/**'
      - 'crates/meridian-secret/**'
      - 'crates/meridian-signing/**'
      - 'crates/meridian-target-fake/**'
      - 'crates/meridian-value/**'
      - 'crates/meridian-yaml/**'
      - 'plugins/podman/**'
      - 'examples/podman/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
      - '.github/workflows/podman.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read

# A newer run for the same branch or pull request cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real:
    if: github.event.pull_request.draft != true
    name: real podman and systemd
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - name: What is installed
        run: |
          podman --version
          systemctl --version | head -n 1
          sudo -n true

      # Units are installed for the whole machine, through sudo, so the test
      # does not depend on the runner having a systemd user session.
      - name: Install, run, change and remove real units
        run: cargo test -p meridian-target-podman --test real --locked -- --ignored --nocapture --test-threads=1
        env:
          MERIDIAN_TEST_REAL_PODMAN: system
