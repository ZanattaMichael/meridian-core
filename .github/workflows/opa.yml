name: opa

# The policy engine against a real Open Policy Agent. The rust workflow
# already runs the engine's other tests; without OPA installed these ones
# pass without doing anything, so they are run here, where it is.

on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/meridian-ast/**'
      - 'crates/meridian-expr/**'
      - 'crates/meridian-graph/**'
      - 'crates/meridian-import/**'
      - 'crates/meridian-ir/**'
      - 'crates/meridian-orchestrator/**'
      - 'crates/meridian-plugin-host/**'
      - 'crates/meridian-plugin-testkit/**'
      - 'crates/meridian-policy-opa/**'
      - 'crates/meridian-sdk/**'
      - 'crates/meridian-secret/**'
      - 'crates/meridian-signing/**'
      - 'crates/meridian-target-fake/**'
      - 'crates/meridian-value/**'
      - 'crates/meridian-yaml/**'
      - 'examples/policy/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/opa.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read

# A newer run for the same branch or pull request cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real:
    if: github.event.pull_request.draft != true
    name: policies with opa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.4.2

      - name: Show the version under test
        run: opa version

      - name: Check the example policy
        run: opa check examples/policy

      - name: Test against opa
        env:
          MERIDIAN_TEST_REAL_OPA: opa
        run: cargo test -p meridian-policy-opa --locked --test real -- --ignored --nocapture
