name: pulumi

# Runs the Pulumi plugin against the real pulumi. The plugin's other tests use
# a stand-in and run with everything else in the rust workflow; this one needs
# the tool and a network, so it runs only when the plugin or what it is built
# on changes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'plugins/pulumi/**'
      - 'examples/pulumi/**'
      - 'crates/meridian-sdk/**'
      - 'crates/meridian-yaml/**'
      - 'crates/meridian-plugin-testkit/**'
      - 'Cargo.lock'
      - '.github/workflows/pulumi.yml'

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real:
    name: against the real pulumi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      # The hosted runners ship Pulumi. Install it only where one does not.
      - name: Find or install pulumi
        run: |
          if ! command -v pulumi >/dev/null; then
            curl -fsSL https://get.pulumi.com | sh
            echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.pulumi/bin:$PATH"
          fi
          pulumi version

      # Pulumi asks GitHub for a provider's latest release. Without a token
      # that request shares the runner's address with everyone else's and is
      # turned away once the shared allowance is spent, so the token is given
      # here and the provider is fetched once, before the tests need it.
      - name: Install the random provider
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pulumi plugin install resource random

      - name: Test against pulumi
        env:
          MERIDIAN_TEST_REAL_PULUMI: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo test -p meridian-target-pulumi --locked --test real -- --ignored --nocapture
