name: helm

# The Helm plugin against the real helm and kustomize, and against a real
# cluster. The rust workflow already runs the plugin's other tests, which
# need nothing installed.
on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/meridian-ast/**'
      - 'crates/meridian-expr/**'
      - 'crates/meridian-graph/**'
      - 'crates/meridian-import/**'
      - 'crates/meridian-ir/**'
      - 'crates/meridian-plugin-host/**'
      - 'crates/meridian-plugin-testkit/**'
      - 'crates/meridian-sdk/**'
      - 'crates/meridian-secret/**'
      - 'crates/meridian-signing/**'
      - 'crates/meridian-target-fake/**'
      - 'crates/meridian-value/**'
      - 'crates/meridian-yaml/**'
      - 'plugins/helm/**'
      - 'plugins/kubernetes/**'
      - 'examples/helm/**'
      - 'Cargo.lock'
      - '.github/workflows/helm.yml'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
  pull_request:
    paths: *paths

permissions:
  contents: read

# A newer run for the same branch or pull request cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-tools:
    name: real helm, kustomize and a kind cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - name: Show the tools
        run: |
          helm version --short
          kustomize version
          kubectl version --client
          kind version

      - name: Render with the real helm and kustomize
        run: cargo test -p meridian-target-helm --locked --test real -- --ignored

      - name: Create a cluster
        run: kind create cluster --name meridian --wait 180s

      - name: Plan, apply and read outputs against the cluster
        run: cargo test -p meridian-target-helm --locked --test cluster -- --ignored

      - name: Show the cluster when something failed
        if: failure()
        run: |
          helm list --all-namespaces --all || true
          kubectl get all,configmaps --all-namespaces || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -40 || true
