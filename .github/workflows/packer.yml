name: packer

# The Packer plugin against the real packer. It is a workflow of its own so
# that the plugin's check on its own output does not depend on any other
# plugin's tool being installed.
on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/meridian-all-targets/**'
      - 'crates/meridian-ast/**'
      - 'crates/meridian-cli/**'
      - 'crates/meridian-expr/**'
      - 'crates/meridian-graph/**'
      - 'crates/meridian-import/**'
      - 'crates/meridian-ir/**'
      - 'crates/meridian-lsp/**'
      - 'crates/meridian-mcp/**'
      - 'crates/meridian-module/**'
      - 'crates/meridian-orchestrator/**'
      - 'crates/meridian-plugin-host/**'
      - 'crates/meridian-plugin-testkit/**'
      - 'crates/meridian-report/**'
      - 'crates/meridian-resolve/**'
      - 'crates/meridian-rules/**'
      - 'crates/meridian-sdk/**'
      - 'crates/meridian-secret/**'
      - 'crates/meridian-signing/**'
      - 'crates/meridian-target-fake/**'
      - 'crates/meridian-test/**'
      - 'crates/meridian-tooling/**'
      - 'crates/meridian-value/**'
      - 'crates/meridian-yaml/**'
      - 'plugins/ansible/**'
      - 'plugins/arm/**'
      - 'plugins/bicep/**'
      - 'plugins/chef/**'
      - 'plugins/cloud-init/**'
      - 'plugins/cloudformation/**'
      - 'plugins/docker/**'
      - 'plugins/dsc/**'
      - 'plugins/helm/**'
      - 'plugins/kubernetes/**'
      - 'plugins/opentofu/**'
      - 'plugins/openvox/**'
      - 'plugins/packer/**'
      - 'plugins/podman/**'
      - 'plugins/pulumi/**'
      - 'plugins/puppet/**'
      - 'plugins/salt/**'
      - 'plugins/terraform/**'
      - 'examples/packer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/packer.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read

# A newer run for the same branch or pull request cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKER_VERSION: 1.11.2
  CHECKPOINT_DISABLE: 1

jobs:
  real-packer:
    if: github.event.pull_request.draft != true
    name: validate and build with packer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - name: Install packer
        run: |
          curl -fsSL -o /tmp/packer.zip "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
          curl -fsSL -o /tmp/packer.sums "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_SHA256SUMS"
          (cd /tmp && grep "packer_${PACKER_VERSION}_linux_amd64.zip" packer.sums | sed 's# .*# packer.zip#' | sha256sum -c -)
          mkdir -p "$HOME/.local/bin"
          unzip -o -q /tmp/packer.zip packer -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/packer" version

      # The tests that are ignored everywhere else because they need packer.
      - name: Test against packer
        run: cargo test -p meridian-target-packer --locked --test packer -- --ignored

      # The same example through the meridian command, as a person would run it.
      - name: Build an example with the meridian command
        run: |
          cargo build --locked -p meridian-cli -p meridian-target-packer
          work="$(mktemp -d)"
          cp examples/packer/hello.yaml "$work/"
          cd "$work"
          "$GITHUB_WORKSPACE/target/debug/meridian" plan hello.yaml | tee plan.txt
          grep -q '+ create box: null image' plan.txt
          "$GITHUB_WORKSPACE/target/debug/meridian" apply hello.yaml | tee apply.txt
          grep -q 'output builder = "null"' apply.txt
