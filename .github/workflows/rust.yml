name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run for the same branch or pull request cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: fmt, clippy and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - name: Check formatting
        run: cargo fmt --all --check

      # --locked fails the build if Cargo.lock is out of step with the manifests.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Every failure in one run: without --no-fail-fast cargo stops at the
      # first test binary that fails, and the rest is only learnt on the
      # next push.
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log

      - name: Show only what failed
        if: failure()
        run: |
          grep -aE "panicked at|^  left:|^ right:|^error(\[|:)|assertion|^Test failed|minimal failing input" test.log \
            | grep -av '"reason":' | cut -c1-400 | tail -n 150 || true
          echo "== failed tests =="
          grep -aE "^test .* FAILED|^    \`-p " test.log | cut -c1-200 || true

  # The same suite on the other systems Meridian is released for. Formatting
  # is checked once, above; clippy runs again here because code behind
  # `cfg(windows)` is only ever compiled on Windows.
  platforms:
    name: clippy and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Every failure in one run, and the whole output kept, so the step
      # below can show the failures without the thousands of lines between.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log

      # The detail first and the list of failed tests last, so the end of
      # the log is the summary.
      - name: Show only what failed
        if: failure()
        shell: bash
        run: |
          grep -aE "panicked at|^  left:|^ right:|^error(\[|:)|assertion|^Test failed|minimal failing input" test.log \
            | grep -av '"reason":' | cut -c1-400 | tail -n 150 || true
          echo "== failed tests =="
          grep -aE "^test .* FAILED|^    \`-p " test.log | cut -c1-200 || true

  # The oldest Rust the workspace promises to build with (`rust-version` in
  # Cargo.toml). A newer feature used by accident fails here, and the fix is
  # either not using it or raising `rust-version` on purpose.
  minimum-rust:
    name: build with the minimum Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Read the minimum version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install it
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: minimum-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check every crate and test
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  # Advisories, licences and sources of every dependency, as deny.toml says.
  dependencies:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
