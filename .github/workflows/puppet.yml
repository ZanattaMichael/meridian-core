name: puppet

# The Puppet plugin against a real `puppet apply`. The rust workflow runs the
# plugin's other tests, which need nothing installed; these are marked
# `#[ignore]` and run here, where the tool is.
on:
  push:
    branches: [main]
    paths:
      - plugins/puppet/**
      - examples/puppet/**
      - crates/meridian-sdk/**
      - crates/meridian-plugin-testkit/**
      - Cargo.lock
      - .github/workflows/puppet.yml
  pull_request:
    paths:
      - plugins/puppet/**
      - examples/puppet/**
      - crates/meridian-sdk/**
      - crates/meridian-plugin-testkit/**
      - Cargo.lock
      - .github/workflows/puppet.yml

permissions:
  contents: read

# A newer run for the same branch or pull request cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-tool:
    name: plan and apply with puppet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # The gem needs no root and no package repository.
      - name: Install Puppet
        run: |
          gem install puppet --no-document
          puppet --version

      # MERIDIAN_TEST_REAL_REQUIRED makes a missing switch a failure, so this
      # job cannot pass by checking nothing.
      - name: Test against puppet
        env:
          MERIDIAN_TEST_REAL_PUPPET: '1'
          MERIDIAN_TEST_REAL_REQUIRED: '1'
        run: cargo test -p meridian-target-puppet --locked --test real -- --ignored --nocapture
