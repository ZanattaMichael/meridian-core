name: opentofu

# The OpenTofu plugin against a real tofu. The rust workflow already runs the
# plugin's other tests; without OpenTofu installed these ones pass without
# doing anything, so they are run here, where it is.

on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/meridian-all-targets/**'
      - 'crates/meridian-ast/**'
      - 'crates/meridian-cli/**'
      - 'crates/meridian-expr/**'
      - 'crates/meridian-graph/**'
      - 'crates/meridian-import/**'
      - 'crates/meridian-ir/**'
      - 'crates/meridian-lsp/**'
      - 'crates/meridian-mcp/**'
      - 'crates/meridian-module/**'
      - 'crates/meridian-orchestrator/**'
      - 'crates/meridian-plugin-host/**'
      - 'crates/meridian-plugin-testkit/**'
      - 'crates/meridian-report/**'
      - 'crates/meridian-resolve/**'
      - 'crates/meridian-rules/**'
      - 'crates/meridian-sdk/**'
      - 'crates/meridian-secret/**'
      - 'crates/meridian-signing/**'
      - 'crates/meridian-target-fake/**'
      - 'crates/meridian-test/**'
      - 'crates/meridian-tooling/**'
      - 'crates/meridian-value/**'
      - 'crates/meridian-yaml/**'
      - 'plugins/ansible/**'
      - 'plugins/arm/**'
      - 'plugins/bicep/**'
      - 'plugins/chef/**'
      - 'plugins/cloud-init/**'
      - 'plugins/cloudformation/**'
      - 'plugins/docker/**'
      - 'plugins/dsc/**'
      - 'plugins/helm/**'
      - 'plugins/kubernetes/**'
      - 'plugins/opentofu/**'
      - 'plugins/openvox/**'
      - 'plugins/packer/**'
      - 'plugins/podman/**'
      - 'plugins/pulumi/**'
      - 'plugins/puppet/**'
      - 'plugins/salt/**'
      - 'plugins/terraform/**'
      - 'examples/opentofu/**'
      - 'examples/common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/opentofu.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read

# A newer run for the same branch or pull request cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real:
    if: github.event.pull_request.draft != true
    name: plan and apply with tofu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      # The wrapper script the action can install rewrites tofu's output, which
      # would break reading its JSON.
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false

      - name: Show the version under test
        run: tofu version

      - name: Test against tofu
        env:
          MERIDIAN_TEST_REAL_TOFU: tofu
          MERIDIAN_TEST_REAL_TOFU_NETWORK: '1'
        run: cargo test -p meridian-target-opentofu --locked --test real --test imports -- --ignored --nocapture

      # `meridian retarget` from Terraform to OpenTofu: what Terraform made is
      # adopted by OpenTofu's first plan, and nothing is made again.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.x
          terraform_wrapper: false

      - name: Retarget from terraform to tofu
        env:
          MERIDIAN_TEST_REAL_RETARGET: '1'
        run: cargo test -p meridian-cli --locked --test retarget_real -- --ignored --nocapture
