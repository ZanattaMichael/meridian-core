name: openvox

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real:
    name: the plugin against a real OpenVox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # The gem needs no root and no package repository, and it is the same
      # code the openvox-agent package ships.
      - name: Install OpenVox
        run: |
          gem install openvox --no-document
          puppet --version
          puppet facts show implementation --render-as json

      # Without the variable these tests skip themselves, so a missing
      # OpenVox could never fail this job. With it, a missing one does.
      - name: Test against OpenVox
        env:
          MERIDIAN_TEST_REAL_OPENVOX: '1'
        run: cargo test -p meridian-target-openvox --locked --test real -- --ignored
